<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>subagent-panel 注入脚本验证（mock 桥）</title>
<style>
  :root{--bg:#111214;--bg-elev:#191b1f;--bg-elev-2:#22252b;--bg-soft:#1e2126;--fg:#e8eaed;--fg-dim:#9aa0a6;--fg-faint:#85888f;
        --border:#2a2d33;--border-soft:#23262b;--accent:#ff5a2c;--accent-fg:#fff}
  html,body{margin:0;height:100%;background:#0c0d0f;color:var(--fg);font:13px/1.5 system-ui,'Segoe UI',sans-serif}
  .stage{display:flex;gap:16px;padding:16px}
  .sim{flex:0 0 420px;height:640px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--bg)}
  /* 模拟 Reasonix 右侧栏结构（静态定位，用于检验 overlay 加固） */
  .workspace-panel{display:flex;flex-direction:column;height:100%}
  .workspace-files{display:flex;flex-direction:column;height:100%;background:var(--bg)}
  .workspace-files__tools{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--border-soft)}
  .workspace-files__tabs{display:flex;align-items:center;gap:4px}
  .workspace-files__tab{padding:4px 9px;border:0;background:transparent;color:var(--fg-dim);border-radius:6px;font:inherit;font-size:12px;cursor:pointer}
  .workspace-files__tab--active{background:var(--bg-elev-2);color:var(--fg)}
  .placeholder{padding:10px;color:var(--fg-faint)}
  .hint{color:var(--fg-faint);max-width:420px}
</style>
</head>
<body>
<div class="stage">
  <div class="sim">
    <div class="workspace-panel">
      <div class="workspace-files">
        <div class="workspace-files__tools">
          <div class="workspace-files__tabs" role="tablist">
            <button class="workspace-files__tab">文件</button>
            <button class="workspace-files__tab workspace-files__tab--active">改动</button>
          </div>
        </div>
        <div class="placeholder">（原生文件/改动内容占位，不应被注入脚本改动）</div>
      </div>
    </div>
  </div>
  <div class="hint">
    <p>验证目标：</p>
    <ol>
      <li>「子代理」按钮出现在 tab 栏（与 文件/改动 并列）</li>
      <li>点击后面板 overlay 覆盖文件区，显示 mock 的子智能体 + 后台进程</li>
      <li>React 节点未被删改（占位文本仍在 DOM 中）</li>
      <li>宿主为 position:static 时被加固为 relative</li>
    </ol>
    <p id="selfcheck">自检中…</p>
  </div>
</div>

<script src="../scripts/dsh-subagent-panel.js"></script>
<script>
// 自检：点击「子代理」按钮后断言注入结果
setTimeout(function () {
  var tab = document.getElementById('dsh-sp-tab');
  var ok = [];
  ok.push('tab 注入: ' + (tab ? '✓' : '✗'));
  if (tab) {
    tab.click();
    setTimeout(function () {
      var panel = document.getElementById('dsh-sp-panel');
      ok.push('面板 overlay: ' + (panel ? '✓' : '✗'));
      ok.push('子智能体卡片: ' + (document.querySelectorAll('.dsh-sp-card').length || 0) + ' 张');
      ok.push('进程行: ' + (document.querySelectorAll('.dsh-sp-table tbody tr').length || 0) + ' 行');
      var host = document.querySelector('.workspace-files');
      ok.push('宿主定位加固: ' + (host && getComputedStyle(host).position === 'relative' ? '✓ relative' : '✗ ' + (host ? getComputedStyle(host).position : 'n/a')));
      var ph = document.querySelector('.placeholder');
      ok.push('React 占位仍在: ' + (ph && ph.textContent.indexOf('占位') >= 0 ? '✓' : '✗'));
      document.getElementById('selfcheck').textContent = 'SELFCHECK ' + ok.join(' | ');
      document.title = 'DONE ' + ok.join(' | ');
    }, 400);
  } else {
    document.getElementById('selfcheck').textContent = 'SELFCHECK ' + ok.join(' | ');
    document.title = 'DONE ' + ok.join(' | ');
  }
}, 1800);
</script>
</body>
</html>
