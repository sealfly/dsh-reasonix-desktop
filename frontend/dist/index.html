      S.loading = false; panel.className = 'dsh-mkt';
      loadCategories();
      loadInstalled();
    }).catch(function(e){
      setMsg('加载失败: ' + (e && e.message || e));
      S.loading = false; panel.className = 'dsh-mkt';
    });
  }
  function renderPages(){
    if (!pagesEl) return;
    var tp = S.totalPages || 1;
    var html = '<button class="dsh-mkt__pg" data-pg="' + (S.page - 1) + '"' + (S.page <= 1 ? ' disabled' : '') + '>上一页</button>';
    var seq = buildPages(S.page, tp);
    for (var i = 0; i < seq.length; i++) {
      var p = seq[i];
      if (p === '...') html += '<span class="dsh-mkt__pg-ell">…</span>';
      else html += '<button class="dsh-mkt__pg' + (p === S.page ? ' dsh-mkt__pg--on' : '') + '" data-pg="' + p + '">' + p + '</button>';
    }
    html += '<button class="dsh-mkt__pg" data-pg="' + (S.page + 1) + '"' + (S.page >= tp ? ' disabled' : '') + '>下一页</button>';
    pagesEl.innerHTML = html;
    pagesEl.querySelectorAll('[data-pg]').forEach(function(b){ b.addEventListener('click', function(){
      if (b.disabled) return;
      var n = parseInt(b.getAttribute('data-pg'), 10);
      if (n >= 1 && n <= tp) loadPage(n);
    }); });
  }
  function buildPages(cur, total){
    if (total <= 7) { var a = []; for (var i = 1; i <= total; i++) a.push(i); return a; }
    var wanted = [1, total, cur - 1, cur, cur + 1];
    var sorted = wanted.filter(function(x){ return x >= 1 && x <= total; }).sort(function(x, y){ return x - y; });
    var out = []; var prev = 0;
    for (var j = 0; j < sorted.length; j++) {
      var v = sorted[j];
      if (v === prev) continue;
      if (v - prev > 1) out.push('...');
      out.push(v);
      prev = v;
    }
    return out;
  }
  function loadInstalled(){
    var A = app(); if (!A) return;
    A.Plugins().then(function(list){
      list = list || [];
      S.installed = {};
      for (var i = 0; i < list.length; i++) if (list[i] && list[i].name) S.installed[list[i].name] = true;
      renderList();
    }).catch(function(){});
  }
  function riskEmoji(r){ return r === 'high' ? '🔴' : (r === 'medium' ? '🟡' : '🟢'); }
  function riskName(r){ return r === 'high' ? '高' : (r === 'medium' ? '中' : '低'); }
  function renderList(){
    if (!listEl) return;
    var html = '';
    for (var i = 0; i < S.items.length; i++) {
      (function(it){
        var id = it.name || it.id || '';
        var open = S.expanded === id;
        var inst = S.installed[id];
        var risk = it.risk || 'low';
        html += '<div class="dsh-mkt__card" data-open="' + open + '">' +
          '<div class="dsh-mkt__row">' +
            '<span class="dsh-mkt__nm">' + esc(riskEmoji(risk)) + ' ' + esc(id) + (it.stars ? ' <span class="dsh-mkt__meta">★' + it.stars + '</span>' : '') + '</span>' +
            '<button class="btn btn--small" data-toggle="' + esc(id) + '">' + (open ? '收起' : '详情') + '</button>' +
          '</div>' +
          '<p class="dsh-mkt__desc">' + esc(it.descriptionZh || it.description || '') + '</p>' +
          '<div class="dsh-mkt__foot">' +
            '<span class="dsh-mkt__tag" data-level="' + esc(risk) + '">' + riskName(risk) + ' 风险</span>' +
            (it.owner ? '<span class="dsh-mkt__tag">' + esc(it.owner) + '</span>' : '') +
            '<span style="flex:1"></span>' +
            (inst ? '<button class="btn btn--small" data-uninstall="' + esc(id) + '">卸载</button>'
                  : '<button class="btn btn--primary btn--small" data-install="' + esc(id) + '">安装</button>') +
            (it.url ? '<a class="btn btn--small" href="' + esc(it.url) + '" target="_blank" rel="noopener">仓库</a>' : '') +
          '</div>' +
          (open ? renderDetail(it) : '') +
        '</div>';
      })(S.items[i]);
    }
    listEl.innerHTML = html || '<div style="padding:6px;opacity:.7">无匹配插件</div>';
    listEl.querySelectorAll('[data-toggle]').forEach(function(b){ b.addEventListener('click', function(){
      var id = b.getAttribute('data-toggle');
      var it = findItem(id);
      if (it) toggleDetail(id, it);
    }); });
    listEl.querySelectorAll('[data-install]').forEach(function(b){ b.addEventListener('click', function(){
      installPlugin(b.getAttribute('data-install'), b);
    }); });
    listEl.querySelectorAll('[data-uninstall]').forEach(function(b){ b.addEventListener('click', function(){
      removePlugin(b.getAttribute('data-uninstall'), b);
    }); });
  }
  function toggleDetail(id, it){
    if (S.expanded === id) { S.expanded = null; renderList(); return; }
    S.expanded = id;
    if (!S.details[id]) {
      S.details[id] = { status: 'loading', data: null };
      renderList();
      var A = app();
      if (A && it.url) {
        A.MarketPluginDetail(it.url).then(function(d){
          S.details[id] = { status: 'done', data: d || {} };
          renderList();
        }).catch(function(e){ S.details[id] = { status: 'done', data: { error: String((e && e.message) || e) } }; renderList(); });
      } else {
        S.details[id] = { status: 'done', data: { error: '无仓库地址' } };
        renderList();
      }
    } else renderList();
  }
  function renderDetail(it){
    var id = it.name || it.id || '';
    var d = S.details[id];
    if (!d) return '';
    var html = '<div class="dsh-mkt__detail">';
    if (d.status === 'loading') html += '<span class="dsh-mkt__status">加载详情…</span>';
    else {
      var data = d.data || {};
      if (data.image && !data.error) html += '<img class="dsh-mkt__img" src="' + esc(data.image) + '" onerror="this.style.display=\'none\'" alt="">';
      if (data.readme) html += '<div class="dsh-mkt__about">' + esc(simplifyReadme(data.readme)) + '</div>';
      else if (data.error) html += '<span class="dsh-mkt__status">' + esc(data.error) + '</span>';
      html += '<div class="dsh-mkt__detail-foot"><code>' + esc(it.install || it.url || '') + '</code>' +
        (it.url ? ' <a href="' + esc(it.url) + '" target="_blank" rel="noopener">在 GitHub 查看 →</a>' : '') + '</div>';
    }
    html += '</div>';
    return html;
  }
  function simplifyReadme(raw){
    var s = String(raw || '').replace(/\r\n/g, '\n').replace(/^---\n[\s\S]*?\n---\n/, '').replace(/<!--[\s\S]*?-->/g, '');
    s = s.replace(/!\[[^\]]*\]\([^)]*\)/g, '').replace(/\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/[#>*_`~|]/g, '').replace(/\n{3,}/g, '\n\n');
    s = s.replace(/\s+/g, ' ').trim();
    return s.length > 500 ? s.slice(0, 500) + '…' : s;
  }
  function esc(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function findItem(id){
    for (var i = 0; i < S.items.length; i++) {
      var it = S.items[i];
      if ((it.name || it.id || '') === id) return it;
    }
    return null;
  }
  function installPlugin(id, btn){
    var A = app(); var it = findItem(id); if (!A || !it) return;
    btn.textContent = '安装中…';
    var src = it.install || it.url || id;
    A.InstallPlugin(src, { name: id }).then(function(plan){
      try {
        var p = JSON.parse(plan);
        btn.textContent = (p && p.ok) ? '已安装' : '失败';
        if (p && p.ok) S.installed[id] = true;
      } catch(e){ btn.textContent = '完成'; S.installed[id] = true; }
      setTimeout(function(){ renderList(); }, 700);
    }).catch(function(){ btn.textContent = '失败'; });
  }
  function removePlugin(id, btn){
    var A = app(); if (!A) return;
    btn.textContent = '卸载中…';
    A.RemovePlugin(id).then(function(){
      delete S.installed[id];
      btn.textContent = '已卸载';
      setTimeout(function(){ renderList(); }, 700);
    }).catch(function(){ btn.textContent = '失败'; });
  }
  var obs = new MutationObserver(function(){ injectIntoPluginPage(); });
  try { obs.observe(document.documentElement, { childList: true, subtree: true }); } catch(e){}
  injectIntoPluginPage();
})();

</script>
<script>
;(function () {
  /* __DSH_UPDATE_BANNER v1 — DSH 新版提醒横幅（仿 Reasonix 更新提醒）。
     启动后调 A.DshUpdateCheck()，available=true 时显示可关闭横幅，
     点击打开更新渠道（GitHub Releases）。无副作用、失败静默。 */
  if (window.__DSH_UPDATE_BANNER__) return;
  window.__DSH_UPDATE_BANNER__ = true;

  var SHOWN_KEY = "dsh-update-banner-dismissed-v1";

  function openExternal(url) {
    try {
      var rt = window.runtime;
      if (rt && rt.OpenExternal) { rt.OpenExternal(url); return; }
    } catch (e) {}
    try { window.open(url, "_blank"); } catch (e) {}
  }

  function showBanner(info) {
    var old = document.getElementById("dsh-update-banner");
    if (old) old.remove();
    var wrap = document.createElement("div");
    wrap.id = "dsh-update-banner";
    wrap.setAttribute("role", "status");
    wrap.style.cssText = [
      "position:fixed", "right:16px", "bottom:16px", "z-index:2147483000",
      "display:flex", "align-items:center", "gap:10px",
      "padding:10px 14px", "border-radius:10px",
      "background:#1b1e24", "border:1px solid #333a45",
      "box-shadow:0 6px 24px rgba(0,0,0,.45)",
      "font:13px/1.4 -apple-system,'Segoe UI',system-ui,sans-serif",
      "color:#e6e8eb", "max-width:460px"
    ].join(";");
    var text = document.createElement("span");
    text.style.cssText = "flex:1;min-width:0";
    text.textContent = "DSH 有新版可用：" + info.current + " → " + info.latest;
    var dl = document.createElement("button");
    dl.type = "button";
    dl.textContent = "下载更新";
    dl.style.cssText = [
      "border:0", "border-radius:6px", "padding:5px 12px", "cursor:pointer",
      "background:#0153e5", "color:#fff", "font:600 12px/1 -apple-system,'Segoe UI',system-ui,sans-serif"
    ].join(";");
    dl.onclick = function () {
      try { localStorage.setItem(SHOWN_KEY, String(Date.now())); } catch (e) {}
      openExternal(info.downloadUrl || info.releaseUrl || info.updateUrl ||
        "https://github.com/sdkwork-ai/deepseek-harness-desktop/releases");
      wrap.remove();
    };
    var detail = document.createElement("button");
    detail.type = "button";
    detail.textContent = "详情";
    detail.style.cssText = [
      "border:1px solid #4a5260", "border-radius:6px", "padding:5px 10px", "cursor:pointer",
      "background:none", "color:#c9d0d9", "font:600 12px/1 -apple-system,'Segoe UI',system-ui,sans-serif"
    ].join(";");
    detail.onclick = function () {
      try { localStorage.setItem(SHOWN_KEY, String(Date.now())); } catch (e) {}
      openExternal(info.releaseUrl || info.updateUrl ||
        "https://github.com/sdkwork-ai/deepseek-harness-desktop/releases");
      wrap.remove();
    };
    var close = document.createElement("button");
    close.type = "button";
    close.textContent = "×";
    close.setAttribute("aria-label", "关闭");
    close.style.cssText = "border:0;background:none;color:#9aa3af;font-size:16px;cursor:pointer;padding:0 2px";
    close.onclick = function () {
      try { localStorage.setItem(SHOWN_KEY, String(Date.now())); } catch (e) {}
      wrap.remove();
    };
    wrap.appendChild(text);
    wrap.appendChild(dl);
    wrap.appendChild(detail);
    wrap.appendChild(close);
    (document.body || document.documentElement).appendChild(wrap);
  }

  function maybeCheck() {
    try {
      var A = window.go && window.go.main && window.go.main.App;
      if (!A || !A.DshUpdateCheck) return;
      A.DshUpdateCheck().then(function (info) {
        if (!info || !info.available) return;
        try { if (localStorage.getItem(SHOWN_KEY)) return; } catch (e) {}
        setTimeout(function () { showBanner(info); }, 800);
      }).catch(function () {});
    } catch (e) {}
  }

  function whenReady(fn) {
    if (document.readyState === "complete" || document.readyState === "interactive") {
      setTimeout(fn, 1);
    } else {
      window.addEventListener("DOMContentLoaded", fn);
    }
  }
  whenReady(function () { setTimeout(maybeCheck, 6000); });
})();

</script>

<script>
// dsh-conn-banner.js — DSH 连接状态横幅 + 自选 DSH 后端设置
// 注入到 Reasonix v1.31.4 前端：启动后查询 A.DshConnStatus()，
// 未连接时显示横幅（启动 DSH / 连接设置），设置弹层支持 host:port 自选 + 测试。
(() => {
  const SHOWN_KEY = 'dsh-conn-banner-shown';
  const CONN_ID = 'dsh-conn-banner';
  const SETTINGS_ID = 'dsh-conn-settings';
  let statusCache = null;

  const css = `
#${CONN_ID}{position:fixed;right:14px;bottom:14px;z-index:2147483646;max-width:360px;background:linear-gradient(135deg,#0153e5,#0b3fa8);color:#fff;border-radius:10px;padding:12px 14px;font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;box-shadow:0 6px 24px rgba(1,83,229,.35);display:none}
#${CONN_ID}.show{display:block}
#${CONN_ID} .b-title{font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}
#${CONN_ID} .b-title .dot{width:9px;height:9px;border-radius:50%;background:#ffd166;flex:none}
#${CONN_ID} .b-desc{opacity:.9;line-height:1.45;margin-bottom:10px}
#${CONN_ID} .b-actions{display:flex;gap:8px;flex-wrap:wrap}
#${CONN_ID} button{border:none;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit}
#${CONN_ID} .btn-start{background:#fff;color:#0153e5;font-weight:600}
#${CONN_ID} .btn-set{background:rgba(255,255,255,.18);color:#fff}
#${CONN_ID} .btn-x{background:transparent;color:rgba(255,255,255,.75);margin-left:auto}
#${CONN_ID} .b-status{font-size:12px;margin-top:8px;opacity:.85;display:none}
#${SETTINGS_ID}{position:fixed;inset:0;z-index:2147483647;background:rgba(10,16,30,.55);display:none;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif}
#${SETTINGS_ID}.show{display:flex}
#${SETTINGS_ID} .s-card{background:#fff;border-radius:12px;padding:20px 22px;width:380px;max-width:92vw;box-shadow:0 12px 40px rgba(0,0,0,.35);color:#1a1a2e}
#${SETTINGS_ID} .s-title{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
#${SETTINGS_ID} .s-title .x{cursor:pointer;color:#999;font-size:18px;line-height:1;padding:2px 6px}
#${SETTINGS_ID} label{display:block;font-size:12px;color:#666;margin:10px 0 4px}
#${SETTINGS_ID} input{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #d5dae4;border-radius:7px;font-size:13px;font-family:inherit}
#${SETTINGS_ID} .s-row{display:flex;gap:10px}
#${SETTINGS_ID} .s-row .s-host{flex:1}
#${SETTINGS_ID} .s-row .s-port{width:110px}
#${SETTINGS_ID} .s-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
#${SETTINGS_ID} .s-actions button{border:none;border-radius:7px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit}
#${SETTINGS_ID} .btn-save{background:#0153e5;color:#fff;font-weight:600}
#${SETTINGS_ID} .btn-test{background:#eef2f9;color:#0153e5}
#${SETTINGS_ID} .btn-cancel{background:#f0f1f4;color:#666}
#${SETTINGS_ID} .s-status{font-size:12px;margin-top:10px;padding:8px 10px;border-radius:6px;display:none}
#${SETTINGS_ID} .s-status.ok{display:block;background:#e8f8ef;color:#147d3f}
#${SETTINGS_ID} .s-status.err{display:block;background:#fdeeee;color:#c0392b}
#${SETTINGS_ID} .s-hint{font-size:11px;color:#999;margin-top:6px}
`;

  function injectCss() {
    const s = document.createElement('style');
    s.id = CONN_ID + '-css';
    s.textContent = css;
    document.head.appendChild(s);
  }

  function el(id, html) {
    let n = document.getElementById(id);
    if (!n) {
      n = document.createElement('div');
      n.id = id;
      document.body.appendChild(n);
    }
    n.innerHTML = html;
    return n;
  }

  function showBanner() {
    el(CONN_ID, `
      <div class="b-title"><span class="dot"></span>DSH 后端未连接</div>
      <div class="b-desc">界面功能需要 DSH 后端（默认 ${statusCache ? statusCache.configured.host + ':' + statusCache.configured.port : '127.0.0.1:3080'}）。可一键启动，或自选其他 DSH 后端。</div>
      <div class="b-actions">
        <button class="btn-start" id="dsh-conn-start">🚀 启动 DSH</button>
        <button class="btn-set" id="dsh-conn-open">⚙️ 连接设置</button>
        <button class="btn-x" id="dsh-conn-close">✕</button>
      </div>
      <div class="b-status" id="dsh-conn-bstatus"></div>
    `);
    document.getElementById('dsh-conn-start').onclick = () => {
      const st = document.getElementById('dsh-conn-bstatus');
      st.style.display = 'block';
      st.textContent = '正在启动 DSH 后端...';
      window.appStartDSH && window.appStartDSH();
    };
    document.getElementById('dsh-conn-open').onclick = openSettings;
    document.getElementById('dsh-conn-close').onclick = () => {
      document.getElementById(CONN_ID).classList.remove('show');
      try { localStorage.setItem(SHOWN_KEY, Date.now().toString()); } catch (e) {}
    };
    document.getElementById(CONN_ID).classList.add('show');
  }

  function openSettings() {
    const c = (statusCache && statusCache.configured) || { host: '127.0.0.1', port: 3080 };
    el(SETTINGS_ID, `
      <div class="s-card">
        <div class="s-title">DSH 连接设置 <span class="x" id="dsh-conn-sclose">✕</span></div>
        <div class="s-row">
          <div class="s-host"><label>主机地址</label><input id="dsh-conn-host" value="${c.host}" placeholder="127.0.0.1"></div>
          <div class="s-port"><label>端口</label><input id="dsh-conn-port" value="${c.port}" placeholder="3080"></div>
        </div>
        <div class="s-hint">可指向本机或局域网/远程的 DeepSeek Harness 实例。</div>
        <div class="s-status" id="dsh-conn-sstatus"></div>
        <div class="s-actions">
          <button class="btn-test" id="dsh-conn-test">测试连接</button>
          <button class="btn-cancel" id="dsh-conn-cancel">取消</button>
          <button class="btn-save" id="dsh-conn-save">保存</button>
        </div>
      </div>
    `);
    const st = document.getElementById('dsh-conn-sstatus');
    const host = () => document.getElementById('dsh-conn-host').value.trim() || '127.0.0.1';
    const port = () => parseInt(document.getElementById('dsh-conn-port').value, 10) || 3080;
    document.getElementById('dsh-conn-sclose').onclick = closeSettings;
    document.getElementById('dsh-conn-cancel').onclick = closeSettings;
    document.getElementById('dsh-conn-test').onclick = () => {
      st.className = 's-status'; st.style.display = 'block'; st.textContent = '测试中...';
      realApp().TestDshConn(host(), port()).then(r => {
        if (r.ok) { st.className = 's-status ok'; st.textContent = '✅ 连接成功：' + r.host + ':' + r.port; }
        else { st.className = 's-status err'; st.textContent = '❌ 无法连接：' + (r.error || '未知错误'); }
      }).catch(e => { st.className = 's-status err'; st.textContent = '❌ 调用失败：' + e; });
    };
    document.getElementById('dsh-conn-save').onclick = () => {
      st.className = 's-status'; st.style.display = 'block'; st.textContent = '保存中...';
      realApp().SetDshConn(host(), port()).then(r => {
        if (r.ok && r.connected) {
          st.className = 's-status ok'; st.textContent = '✅ 已保存并连接：' + r.host + ':' + r.port;
          setTimeout(() => { closeSettings(); location.reload(); }, 900);
        } else if (r.ok) {
          st.className = 's-status err'; st.textContent = '⚠️ 已保存，但当前无法连接：' + (r.warning || '');
        } else {
          st.className = 's-status err'; st.textContent = '❌ ' + (r.error || '保存失败');
        }
      }).catch(e => { st.className = 's-status err'; st.textContent = '❌ 调用失败：' + e; });
    };
    document.getElementById(SETTINGS_ID).classList.add('show');
  }

  function closeSettings() {
    const m = document.getElementById(SETTINGS_ID);
    if (m) m.classList.remove('show');
  }

  // 通过 DSH 桥启动（走 Go 侧 DshLaunch）
  window.appStartDSH = () => {
    realApp().DshLaunch().then(r => {
      const st = document.getElementById('dsh-conn-bstatus');
      if (r.ok && r.started) {
        st.textContent = '✅ DSH 正在启动，初始化可能需要几秒...';
        setTimeout(() => location.reload(), 3500);
      } else if (r.ok && r.alreadyRunning) {
        st.textContent = '✅ DSH 已在运行，正在刷新...';
        setTimeout(() => location.reload(), 1200);
      } else {
        st.textContent = '❌ ' + (r.error || '启动失败');
      }
    }).catch(e => {
      const st = document.getElementById('dsh-conn-bstatus');
      if (st) st.textContent = '❌ 启动失败：' + e;
    });
  };

  function realApp() {
    const g = window.go && window.go.main && window.go.main.App;
    if (g) return g;
    return {
      TestDshConn: () => Promise.reject('bridge unavailable'),
      SetDshConn: () => Promise.reject('bridge unavailable'),
      DshLaunch: () => Promise.reject('bridge unavailable')
    };
  }

  function check() {
    realApp().DshConnStatus().then(s => {
      statusCache = s;
      if (!s.connected) {
        // 连接失败：显示横幅（用户关闭过则本次会话不再自动弹出，仍可在设置里操作）
        try {
          const shown = parseInt(localStorage.getItem(SHOWN_KEY) || '0', 10);
          if (shown && Date.now() - shown < 24 * 3600 * 1000) {
            // 已关闭过（24h 内）：仅保留设置入口不弹横幅
            return;
          }
        } catch (e) {}
        showBanner();
      }
    }).catch(() => {});
  }

  function boot() {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => { injectCss(); setTimeout(check, 4000); });
    } else {
      injectCss();
      setTimeout(check, 4000);
    }
  }
  boot();
})();

</script>

<script>
/* __DSH_AGENT_PRESETS v2 (DSH 四模式/Agent 预设选择器注入, 含选中箭头指示) */
// dsh-agent-presets.js — DSH 四模式（Agent 预设）选择器注入。
// 在 Composer「执行方式」菜单里追加 Agent 模式分组，点击切换 DSH 会话预设。
// v2: 自带选中视觉——高亮背景 + 右侧箭头指示当前模式（不依赖官方 CSS-in-JS 样式）。
// 独立普通脚本（非 module），不改动压缩 JSX；通过 window.go.main.App 桥调用 Go。

(function () {
  "use strict";
  var PRESETS = [
    { id: "standard", name: "标准模式", desc: "功能完整编码 Agent" },
    { id: "code", name: "PTC 模式", desc: "Code Mode SDK · TypeScript 组合" },
    { id: "minimal", name: "极简模式", desc: "bash + str_replace_editor" },
    { id: "cordis", name: "创造模式", desc: "创建自定义 preset" }
  ];
  var current = null; // 当前 preset id（本地记录）
  var injectedKey = "dsh-presets-injected";

  // 自带样式：选中项 = 高亮背景 + 右侧箭头 ▶（用户可明确看出当前模式）
  var css = [
    "." + injectedKey + "{display:flex;align-items:center;justify-content:space-between;width:100%;box-sizing:border-box;background:transparent;border:none;color:inherit;padding:7px 10px;margin:1px 0;text-align:left;cursor:pointer;font:inherit;border-radius:6px}",
    "." + injectedKey + ":hover{background:rgba(255,255,255,.08)}",
    "." + injectedKey + ".composer-access-menu__item--active,." + injectedKey + "[aria-checked='true']{background:rgba(1,83,229,.22)}",
    "." + injectedKey + ".composer-access-menu__item--active::after,." + injectedKey + "[aria-checked='true']::after{content:'\\25B6';font-size:10px;color:#5b9bff;flex:none;margin-left:8px}",
    "." + injectedKey + " .composer-access-menu__copy{display:flex;flex-direction:column;min-width:0}",
    "." + injectedKey + " .composer-access-menu__title{font-weight:600;font-size:13px;line-height:1.3}",
    "." + injectedKey + " .composer-access-menu__desc{font-size:11px;opacity:.65;margin-top:2px;line-height:1.3}"
  ].join("\n");
  var styleEl = document.createElement("style");
  styleEl.id = "dsh-presets-css";
  styleEl.textContent = css;
  document.head.appendChild(styleEl);

  function bridge() {
    try { return window.go && window.go.main && window.go.main.App ? window.go.main.App : null; }
    catch (e) { return null; }
  }

  // 菜单里插入 Agent 模式分组
  function injectInto(menu) {
    var section = menu.querySelector(".composer-access-menu__section");
    if (!section || section.querySelector("." + injectedKey)) return;
    var label = document.createElement("div");
    label.className = "composer-access-menu__label";
    label.textContent = "Agent 模式";
    section.appendChild(label);
    PRESETS.forEach(function (p) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.role = "menuitemradio";
      btn.setAttribute("aria-checked", current === p.id ? "true" : "false");
      btn.className = "composer-access-menu__item composer-intent-menu__item " + injectedKey + (current === p.id ? " composer-access-menu__item--active" : "");
      btn.title = p.desc;
      var copy = document.createElement("span");
      copy.className = "composer-access-menu__copy";
      var t = document.createElement("span");
      t.className = "composer-access-menu__title";
      t.textContent = p.name;
      var d = document.createElement("span");
      d.className = "composer-access-menu__desc";
      d.textContent = p.desc;
      copy.appendChild(t);
      copy.appendChild(d);
      btn.appendChild(copy);
      btn.addEventListener("click", function () {
        var app = bridge();
        if (!app || !app.SetAgentPresetForTab) return;
        // tabId 传空 → Go 端 activeSessionID 落到活跃会话
        app.SetAgentPresetForTab("", p.id).then(function (r) {
          if (r && r.ok) {
            current = p.id;
            syncChecks();
            if (window.__dshPresetToast) window.__dshPresetToast("已切换到 " + p.name);
          } else {
            var err = (r && r.error) || "切换失败";
            // DSH 语义：已启动(running)会话的 preset 锁定(agent-preset-locked)，
            // 不能原地切换——用该模式新开会话（session.create 带 agentPreset）。
            if (err.indexOf("locked") >= 0 || err.indexOf("started") >= 0 || err.indexOf("fixed") >= 0) {
              if (app.CreateSession) {
                if (window.__dshPresetToast) window.__dshPresetToast("当前会话已启动(预设固定)，正在用「" + p.name + "」新开会话…");
                app.CreateSession("", p.id).then(function (r2) {
                  var nid = r2 && (r2.id || r2.tabId || r2.sessionId);
                  if (nid) {
                    current = p.id;
                    syncChecks();
                    if (window.__dshPresetToast) window.__dshPresetToast("已创建「" + p.name + "」新会话 " + String(nid).substring(0, 8) + "… 请在会话列表查看");
                  } else if (window.__dshPresetToast) {
                    window.__dshPresetToast("新开会话失败：" + ((r2 && r2.error) || "未知错误"));
                  }
                }).catch(function () {
                  if (window.__dshPresetToast) window.__dshPresetToast("新开会话调用失败");
                });
              } else if (window.__dshPresetToast) {
                window.__dshPresetToast("当前会话已启动，预设固定(DSH限制)。请新开会话后再选模式");
              }
            } else if (window.__dshPresetToast) {
              window.__dshPresetToast(err);
            }
          }
        }).catch(function () {});
      });
      section.appendChild(btn);
    });
    menu.setAttribute("data-dsh-presets", "1");
  }

  // 同步所有已注入菜单的选中态（按标题匹配 preset 名，不依赖索引）
  function syncChecks() {
    var menus = document.querySelectorAll(".composer-intent-menu[data-dsh-presets='1']");
    for (var m = 0; m < menus.length; m++) {
      var items = menus[m].querySelectorAll("." + injectedKey);
      for (var i = 0; i < items.length; i++) {
        var title = items[i].querySelector(".composer-access-menu__title");
        var on = false;
        if (title) {
          for (var j = 0; j < PRESETS.length; j++) {
            if (title.textContent === PRESETS[j].name) { on = current === PRESETS[j].id; break; }
          }
        }
        items[i].setAttribute("aria-checked", on ? "true" : "false");
        items[i].classList.toggle("composer-access-menu__item--active", on);
      }
    }
  }

  // 读取当前默认 preset（首次）
  function loadCurrent() {
    var app = bridge();
    if (!app || !app.AgentPresets) return;
    app.AgentPresets().then(function (v) {
      if (!v || !v.presets) return;
      for (var i = 0; i < v.presets.length; i++) {
        if (v.presets[i].isDefault) { current = v.presets[i].id; break; }
      }
      syncChecks();
    }).catch(function () {});
  }

  // 轻量 toast（复用 body 内联样式）
  if (!window.__dshPresetToast) {
    window.__dshPresetToast = function (msg) {
      var el = document.createElement("div");
      el.style.cssText = "position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99999;background:#1c1d21;color:#f4f4f3;border:1px solid #333;border-radius:8px;padding:8px 16px;font:13px Inter,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.5);pointer-events:none;opacity:0;transition:opacity .2s";
      el.textContent = msg;
      document.body.appendChild(el);
      requestAnimationFrame(function () { el.style.opacity = "1"; });
      setTimeout(function () { el.style.opacity = "0"; setTimeout(function () { el.remove(); }, 250); }, 1800);
    };
  }

  function start() {
    loadCurrent();
    var observer = new MutationObserver(function () {
      var menus = document.querySelectorAll(".composer-intent-menu");
      for (var i = 0; i < menus.length; i++) injectInto(menus[i]);
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });
    // 立即尝试一次
    var menus = document.querySelectorAll(".composer-intent-menu");
    for (var i = 0; i < menus.length; i++) injectInto(menus[i]);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();

</script>
<script>
/* __DSH_VERSION_MANAGE v2 (DSH 核心版本管理 - 挂到 设置-更新页, 本地注入) */
// dsh-version-manage.js — 在设置面板「更新」页（updates-control 区块后）追加
// 「DSH 核心版本」管理区：当前版本 / 最新版本 / npm 版本列表选择 /
// GitHub Releases（含 win-x64 安装包直链下载）。
// 独立普通脚本（非 module）；通过 window.go.main.App 桥调用 Go。
// 样式自带（Reasonix 是 CSS-in-JS，CSS 文件无对应类）。

(function () {
  "use strict";
  if (window.__DSH_VERSION_MANAGE__) return;
  window.__DSH_VERSION_MANAGE__ = true;

  var NS = "dsh-version-manage";
  var injectTimer = null;
  var css = [
    "." + NS + "{margin:18px 0;padding:14px 16px;border:1px solid var(--border,#333);border-radius:10px;background:var(--surface,#17181b)}",
    "." + NS + "__head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}",
    "." + NS + "__title{font-weight:600;font-size:13px}",
    "." + NS + "__badge{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(1,83,229,.2);color:#7ab2ff;white-space:nowrap}",
    "." + NS + "__badge--ok{background:rgba(34,197,94,.15);color:#4ade80}",
    "." + NS + "__row{display:flex;align-items:center;gap:8px;font-size:12px;margin:5px 0;flex-wrap:wrap}",
    "." + NS + "__row b{font-weight:600}",
    "." + NS + "__row select{padding:4px 6px;border-radius:6px;border:1px solid #333;background:#222;color:inherit;font-size:12px;max-width:220px}",
    "." + NS + "__btn{padding:5px 12px;border-radius:6px;border:1px solid #333;background:rgba(255,255,255,.06);color:inherit;font-size:12px;cursor:pointer}",
    "." + NS + "__btn:hover{background:rgba(255,255,255,.12)}",
    "." + NS + "__btn--primary{border-color:#2563eb;background:rgba(1,83,229,.25);color:#7ab2ff}",
    "." + NS + "__btn:disabled{opacity:.5;cursor:not-allowed}",
    "." + NS + "__rel{border-top:1px dashed #333;margin-top:10px;padding-top:8px;font-size:11px}",
    "." + NS + "__rel-item{display:flex;align-items:center;gap:8px;margin:5px 0;flex-wrap:wrap}",
    "." + NS + "__tag{font-weight:600;color:#7ab2ff}",
    "." + NS + "__date{opacity:.6}",
    "." + NS + "__hint{opacity:.55;font-size:11px;margin-top:6px}",
    "." + NS + "__status{font-size:11px;opacity:.8;margin-top:6px;min-height:14px;word-break:break-all}",
    "." + NS + "__err{color:#f87171;font-size:11px;margin-top:4px}"
  ].join("\n");
  var styleEl = document.createElement("style");
  styleEl.id = "dsh-version-manage-css";
  styleEl.textContent = css;
  document.head.appendChild(styleEl);

  function bridge() {
    try { return window.go && window.go.main && window.go.main.App ? window.go.main.App : null; }
    catch (e) { return null; }
  }
  function toast(msg) {
    if (window.__dshPresetToast) { window.__dshPresetToast(msg); return; }
    var el = document.createElement("div");
    el.style.cssText = "position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99999;background:#1c1d21;color:#f4f4f3;border:1px solid #333;border-radius:8px;padding:8px 16px;font:13px Inter,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.5);pointer-events:none;opacity:0;transition:opacity .2s";
    el.textContent = msg;
    document.body.appendChild(el);
    requestAnimationFrame(function () { el.style.opacity = "1"; });
    setTimeout(function () { el.style.opacity = "0"; setTimeout(function () { el.remove(); }, 250); }, 2200);
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmtSize(n) {
    if (!n) return "";
    if (n > 1048576) return (n / 1048576).toFixed(1) + " MB";
    return Math.round(n / 1024) + " KB";
  }

  // 渲染「DSH 核心版本」区块
  function renderBlock(container, data) {
    var cur = data.current || "unknown";
    var latest = data.latest || cur;
    var badge = data.available ? '<span class="' + NS + '__badge">有新版本</span>'
      : '<span class="' + NS + '__badge ' + NS + '__badge--ok">已是最新</span>';

    var wrap = document.createElement("div");
    wrap.className = NS;
    wrap.innerHTML =
      '<div class="' + NS + '__head"><span class="' + NS + '__title">DSH 核心版本</span>' + badge + "</div>" +
      '<div class="' + NS + '__row"><span>当前：<b>' + esc(cur) + "</b></span>" +
      '<span>最新：<b>' + esc(latest) + "</b></span>" +
      '<button class="' + NS + '__btn" data-act="refresh">重新检测</button></div>' +
      '<div class="' + NS + '__row"><span>npm 版本选择：</span><select data-role="ver"></select>' +
      '<button class="' + NS + '__btn ' + NS + '__btn--primary" data-act="npm-dl">下载所选版本 (npm tarball)</button></div>' +
      '<div class="' + NS + '__row"><span>桌面端 Release：</span>' +
      '<a class="' + NS + '__btn" data-act="gh-open" href="#" target="_blank">打开 Releases 页</a></div>' +
      '<div class="' + NS + '__rel" data-role="rels"></div>' +
      '<div class="' + NS + '__status" data-role="status"></div>' +
      '<div class="' + NS + '__err" data-role="err"></div>' +
      '<div class="' + NS + '__hint">下载保存到 ~/.reasonix/downloads/。桌面端安装包 = DeepSeek Harness Desktop 完整安装包（内含 DSH 核心），下载后运行安装即可更新。</div>';

    var sel = wrap.querySelector('[data-role="ver"]');
    (data.versions || []).forEach(function (v) {
      var o = document.createElement("option");
      o.value = v;
      o.textContent = v;
      if (v === latest) o.textContent = v + " (latest)";
      if (v === cur) o.selected = true;
      sel.appendChild(o);
    });
    if (!sel.options.length) {
      var none = document.createElement("option");
      none.value = "";
      none.textContent = "无可用版本列表";
      sel.appendChild(none);
    }

    var relBox = wrap.querySelector('[data-role="rels"]');
    (data.releases || []).forEach(function (r) {
      var item = document.createElement("div");
      item.className = NS + "__rel-item";
      var tag = document.createElement("span");
      tag.className = "dsh-version-manage__tag";
      tag.textContent = r.tag + (r.prerelease ? " (pre)" : "");
      var date = document.createElement("span");
      date.className = NS + "__date";
      date.textContent = String(r.date || "").slice(0, 10);
      item.appendChild(tag);
      item.appendChild(date);
      if (r.winUrl) {
        var btn = document.createElement("button");
        btn.className = NS + "__btn " + NS + "__btn--primary";
        btn.textContent = "下载安装包";
        btn.dataset.url = r.winUrl;
        btn.dataset.name = (r.tag || "dsh-desktop") + "-win-x64.exe";
        btn.addEventListener("click", function () { doDownload(btn.dataset.url, btn.dataset.name, btn); });
        item.appendChild(btn);
      }
      var link = document.createElement("a");
      link.className = NS + "__btn";
      link.href = r.url || "#";
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = "详情";
      item.appendChild(link);
      relBox.appendChild(item);
    });

    wrap.querySelector('[data-act="refresh"]').addEventListener("click", function () {
      var status = wrap.querySelector('[data-role="status"]');
      status.textContent = "检测中…";
      loadData(function (d2) { renderBlock(container, d2); });
    });
    wrap.querySelector('[data-act="npm-dl"]').addEventListener("click", function () {
      var v = sel.value;
      if (!v) { toast("请先选择 npm 版本"); return; }
      doDownload("https://registry.npmjs.org/@deepseek-ai/dsh/-/dsh-" + encodeURIComponent(v) + ".tgz", "dsh-" + v + ".tgz", wrap.querySelector('[data-act="npm-dl"]'));
    });
    var gh = wrap.querySelector('[data-act="gh-open"]');
    gh.href = data.updateUrl || "https://github.com/sdkwork-ai/deepseek-harness-desktop/releases";
    gh.addEventListener("click", function () { if (!data.releases || !data.releases.length) { toast("打开 GitHub Releases 页面…"); } });

    container.appendChild(wrap);
  }

  function doDownload(url, name, btn) {
    var app = bridge();
    var status = document.querySelector('[data-role="status"]');
    if (!app || !app.DshDownloadVersion) { toast("桥方法不可用"); return; }
    if (btn) { btn.disabled = true; btn.textContent = "下载中…"; }
    if (status) status.textContent = "下载中：" + name + "（大文件请耐心等待）…";
    app.DshDownloadVersion(url, name).then(function (r) {
      if (btn) { btn.disabled = false; btn.textContent = r && r.ok ? "已下载" : "重新下载"; }
      if (status) {
        status.textContent = r && r.ok
          ? "✅ 已下载：" + (r.path || "") + "（" + fmtSize(r.size) + "）"
          : "❌ " + ((r && r.error) || "下载失败");
      }
      if (!r || !r.ok) toast("下载失败：" + ((r && r.error) || "未知错误"));
      else toast("下载完成：" + (r.fileName || name));
    }).catch(function (e) {
      if (btn) { btn.disabled = false; btn.textContent = "重试"; }
      if (status) status.textContent = "❌ 下载调用异常";
      toast("下载调用失败");
    });
  }

  function loadData(cb) {
    var app = bridge();
    if (!app || !app.DshVersionManage) { cb({ current: "unknown", latest: "", versions: [], releases: [] }); return; }
    app.DshVersionManage().then(function (d) { cb(d || {}); }).catch(function () { cb({ current: "unknown", latest: "", versions: [], releases: [] }); });
  }

  var injectedKey = "dsh-vm-injected";
  function inject() {
    // 节流：mutation 高频触发时合并为每 300ms 一次，防止设置面板渲染风暴下主线程卡死
    if (injectTimer) return;
    injectTimer = setTimeout(function () {
      injectTimer = null;
      doInject();
    }, 300);
  }
  function doInject() {
    // 锚点：设置-更新页的更新控制区块（updates-control），在其后插入 DSH 版本管理。
    // 页签切换会重建该区块，故用元素级标记（host.dataset）而非全局 once；
    // 全局注入标志防止任何重建-注入循环。
    if (window.__DSH_VM_INJECTED) return;
    var hosts = document.querySelectorAll(".updates-control");
    for (var h = 0; h < hosts.length; h++) {
      var host = hosts[h];
      if (host.dataset && host.dataset.dshVm === "1") continue;
      if (host.dataset) host.dataset.dshVm = "1";
      window.__DSH_VM_INJECTED = true;
      var container = document.createElement("div");
      container.style.cssText = "margin:14px 0 4px;width:100%";
      host.parentNode.insertBefore(container, host.nextSibling);
      var status = document.createElement("div");
      status.className = NS + "__status";
      status.style.cssText = "margin:10px 0;font-size:12px;opacity:.8";
      status.textContent = "正在读取 DSH 版本信息…";
      container.appendChild(status);
      (function (c, st) {
        loadData(function (d) {
          if (!c.isConnected) return;
          st.remove();
          renderBlock(c, d);
        });
      })(container, status);
    }
  }

  function start() {
    var obs = new MutationObserver(function () { inject(); });
    obs.observe(document.documentElement, { childList: true, subtree: true });
    doInject();
    // 注入成功后 3 秒断开观察（版本管理区已渲染，无需持续监控）
    var guard = setInterval(function () {
      if (window.__DSH_VM_INJECTED) {
        clearInterval(guard);
        obs.disconnect();
      }
    }, 500);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();

</script>
<script>
/* __DSH_MEMORY_PLUGINS v1 (记忆插件管理 - 设置-记忆页, 本地注入) */
// dsh-memory-plugins.js — 在设置面板「记忆」页注入记忆插件管理区：
// 推荐插件（@openviking/dsh-memory-plugin / hindsight / memos-local）安装·启用·禁用·卸载、
// 本机已装记忆插件检测（与插件市场关联：用户从插件市场装的记忆插件在此可见）、
// 记忆插件市场浏览（dsh-1024store memory 分类，同源）。
// 默认关闭：插件需手动启用（持久化到 ~/.reasonix/memory-plugins.json）。
// 独立普通脚本（非 module）；通过 window.go.main.App 桥调用 Go。

(function () {
  "use strict";
  if (window.__DSH_MEMORY_PLUGINS__) return;
  window.__DSH_MEMORY_PLUGINS__ = true;

  var NS = "dsh-mem";
  var css = [
    "." + NS + "{margin:14px 0;padding:14px 16px;border:1px solid var(--border,#333);border-radius:10px;background:var(--surface,#17181b)}",
    "." + NS + "__head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}",
    "." + NS + "__title{font-weight:600;font-size:13px}",
    "." + NS + "__sub{font-size:11px;opacity:.65;margin:2px 0 10px}",
    "." + NS + "__card{border:1px solid #333;border-radius:8px;padding:10px 12px;margin:8px 0}",
    "." + NS + "__card-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}",
    "." + NS + "__name{font-weight:600;font-size:12px}",
    "." + NS + "__stars{font-size:11px;opacity:.6}",
    "." + NS + "__desc{font-size:11px;opacity:.8;margin:6px 0 8px;line-height:1.5}",
    "." + NS + "__badge{font-size:10px;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.07);white-space:nowrap}",
    "." + NS + "__badge--on{background:rgba(34,197,94,.18);color:#4ade80}",
    "." + NS + "__badge--off{background:rgba(255,255,255,.07);color:inherit}",
    "." + NS + "__badge--miss{background:rgba(148,163,184,.15);color:#94a3b8}",
    "." + NS + "__btn{padding:4px 11px;border-radius:6px;border:1px solid #333;background:rgba(255,255,255,.06);color:inherit;font-size:11px;cursor:pointer}",
    "." + NS + "__btn:hover{background:rgba(255,255,255,.12)}",
    "." + NS + "__btn--primary{border-color:#2563eb;background:rgba(1,83,229,.25);color:#7ab2ff}",
    "." + NS + "__btn:disabled{opacity:.5;cursor:not-allowed}",
    "." + NS + "__list{font-size:11px;margin-top:8px}",
    "." + NS + "__list-item{display:flex;align-items:center;gap:8px;margin:4px 0;flex-wrap:wrap}",
    "." + NS + "__mkt{max-height:260px;overflow:auto;margin-top:8px;border-top:1px dashed #333;padding-top:8px}",
    "." + NS + "__mkt-item{display:flex;align-items:center;gap:8px;margin:5px 0;flex-wrap:wrap;font-size:11px}",
    "." + NS + "__status{font-size:11px;opacity:.8;margin-top:8px;min-height:14px;word-break:break-all}",
    "." + NS + "__err{color:#f87171;font-size:11px;margin-top:4px}",
    "." + NS + "__hint{font-size:10px;opacity:.5;margin-top:6px;line-height:1.5}"
  ].join("\n");
  var styleEl = document.createElement("style");
  styleEl.id = "dsh-memory-plugins-css";
  styleEl.textContent = css;
  document.head.appendChild(styleEl);

  function bridge() {
    try { return window.go && window.go.main && window.go.main.App ? window.go.main.App : null; }
    catch (e) { return null; }
  }
  function toast(msg) {
    if (window.__dshPresetToast) { window.__dshPresetToast(msg); return; }
    var el = document.createElement("div");
    el.style.cssText = "position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99999;background:#1c1d21;color:#f4f4f3;border:1px solid #333;border-radius:8px;padding:8px 16px;font:13px Inter,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.5);pointer-events:none;opacity:0;transition:opacity .2s";
    el.textContent = msg;
    document.body.appendChild(el);
    requestAnimationFrame(function () { el.style.opacity = "1"; });
    setTimeout(function () { el.style.opacity = "0"; setTimeout(function () { el.remove(); }, 250); }, 2400);
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmtStars(n) { return n ? (n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n)) : ""; }
  function statusOf(p) {
    if (!p.installed) return '<span class="' + NS + '__badge ' + NS + '__badge--miss">未安装</span>';
    return p.enabled
      ? '<span class="' + NS + '__badge ' + NS + '__badge--on">已启用</span>'
      : '<span class="' + NS + '__badge ' + NS + '__badge--off">已安装 · 未启用</span>';
  }

  // 推荐插件卡片
  function renderRecommended(box, data) {
    (data.recommended || []).forEach(function (p) {
      var card = document.createElement("div");
      card.className = NS + "__card";
      var head = document.createElement("div");
      head.className = NS + "__card-head";
      head.innerHTML = '<span class="' + NS + '__name">' + esc(p.name) + "</span>" +
        '<span class="' + NS + '__stars">★ ' + fmtStars(p.stars) + "</span>" + statusOf(p);
      var desc = document.createElement("div");
      desc.className = NS + "__desc";
      desc.textContent = p.desc;
      var actions = document.createElement("div");
      actions.style.cssText = "display:flex;gap:6px;flex-wrap:wrap";
      if (!p.installed) {
        var inst = document.createElement("button");
        inst.className = NS + "__btn " + NS + "__btn--primary";
        inst.textContent = "安装";
        inst.addEventListener("click", function () { doInstall(p, inst); });
        actions.appendChild(inst);
      } else {
        if (!p.enabled) {
          var en = document.createElement("button");
          en.className = NS + "__btn " + NS + "__btn--primary";
          en.textContent = "启用";
          en.addEventListener("click", function () { setEnabled(p, true, en); });
          actions.appendChild(en);
        } else {
          var dis = document.createElement("button");
          dis.className = NS + "__btn";
          dis.textContent = "禁用";
          dis.addEventListener("click", function () { setEnabled(p, false, dis); });
          actions.appendChild(dis);
        }
        var un = document.createElement("button");
        un.className = NS + "__btn";
        un.textContent = "卸载";
        un.addEventListener("click", function () { doUninstall(p, un); });
        actions.appendChild(un);
      }
      card.appendChild(head);
      card.appendChild(desc);
      card.appendChild(actions);
      box.appendChild(card);
    });
  }

  // 本机已装记忆插件（含用户自装——插件市场关联）
  function renderInstalled(box, data) {
    var list = (data.installed || []).filter(function (i) {
      return !(data.recommended || []).some(function (r) { return r.id === i.id || r.name === i.id; });
    });
    if (!list.length) return;
    var wrap = document.createElement("div");
    wrap.className = NS + "__list";
    wrap.innerHTML = '<div style="font-weight:600;margin:6px 0 4px">已安装的记忆插件（含插件市场安装）</div>';
    list.forEach(function (i) {
      var item = document.createElement("div");
      item.className = NS + "__list-item";
      var idSpan = document.createElement("span");
      idSpan.style.cssText = "font-weight:600";
      idSpan.textContent = i.id;
      var badge = document.createElement("span");
      badge.className = i.enabled ? (NS + "__badge " + NS + "__badge--on") : (NS + "__badge " + NS + "__badge--off");
      badge.textContent = i.enabled ? "已启用" : "未启用";
      var enBtn = document.createElement("button");
      enBtn.className = NS + "__btn " + (i.enabled ? "" : NS + "__btn--primary");
      enBtn.textContent = i.enabled ? "禁用" : "启用";
      enBtn.addEventListener("click", function () {
        setEnabled({ id: i.id, name: i.id }, !i.enabled, enBtn);
      });
      item.appendChild(idSpan);
      item.appendChild(badge);
      item.appendChild(enBtn);
      wrap.appendChild(item);
    });
    box.appendChild(wrap);
  }

  // 记忆插件市场浏览
  function renderMarket(box) {
    var wrap = document.createElement("div");
    wrap.className = NS + "__list";
    var head = document.createElement("div");
    head.style.cssText = "font-weight:600;margin:8px 0 4px;display:flex;align-items:center;gap:8px";
    head.innerHTML = '<span>记忆插件市场（memory 分类 · dsh-1024store）</span>';
    var more = document.createElement("button");
    more.className = NS + "__btn";
    more.textContent = "刷新";
    more.addEventListener("click", function () { loadMarket(wrap, more); });
    head.appendChild(more);
    wrap.appendChild(head);
    var mkt = document.createElement("div");
    mkt.className = NS + "__mkt";
    mkt.textContent = "加载中…";
    wrap.appendChild(mkt);
    box.appendChild(wrap);
    loadMarket(wrap, more);
  }

  function loadMarket(wrap, btn) {
    var app = bridge();
    var mkt = wrap.querySelector("." + NS + "__mkt");
    if (!app || !app.MemoryPluginMarket) { mkt.textContent = "桥方法不可用"; return; }
    if (btn) btn.disabled = true;
    app.MemoryPluginMarket("", 1).then(function (d) {
      if (btn) btn.disabled = false;
      var items = (d && d.items) || [];
      if (!items.length) { mkt.textContent = "暂无记忆插件（" + ((d && d.error) || "网络异常") + "）"; return; }
      mkt.innerHTML = "";
      items.forEach(function (p) {
        var item = document.createElement("div");
        item.className = NS + "__mkt-item";
        var nm = document.createElement("span");
        nm.style.cssText = "font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap";
        nm.textContent = p.name;
        var st = document.createElement("span");
        st.className = NS + "__badge " + (p.installed ? NS + "__badge--on" : NS + "__badge--off");
        st.textContent = p.installed ? "已安装" : "★ " + fmtStars(p.stars);
        var installBtn = document.createElement("button");
        installBtn.className = NS + "__btn " + (p.installed ? "" : NS + "__btn--primary");
        installBtn.textContent = p.installed ? "已安装" : "安装";
        if (!p.installed) {
          installBtn.addEventListener("click", function () {
            doInstall({ id: p.id, name: p.name, install: p.install }, installBtn);
          });
        }
        var link = document.createElement("a");
        link.href = p.url || "#";
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = "详情";
        link.style.cssText = "color:#7ab2ff;text-decoration:none";
        item.appendChild(nm);
        item.appendChild(st);
        item.appendChild(installBtn);
        item.appendChild(link);
        mkt.appendChild(item);
      });
      mkt.appendChild((function () {
        var h = document.createElement("div");
        h.className = NS + "__hint";
        h.textContent = "共 " + (d.total || 0) + " 个记忆插件；更多可到「插件」页浏览完整市场。";
        return h;
      })());
    }).catch(function () { if (btn) btn.disabled = false; mkt.textContent = "市场加载失败"; });
  }

  function doInstall(p, btn) {
    var app = bridge();
    var status = document.querySelector("." + NS + "__status");
    if (!app || !app.InstallMemoryPlugin) { toast("桥方法不可用"); return; }
    var spec = (p.install || "").replace(/^dsh plugin --profile web add\s*/, "") || p.id;
    if (btn) { btn.disabled = true; btn.textContent = "安装中…（可能几分钟）"; }
    if (status) status.textContent = "正在安装 " + (p.name || spec) + "（npm/pnpm 下载）…";
    app.InstallMemoryPlugin(spec).then(function (r) {
      if (btn) { btn.disabled = false; }
      if (r && r.ok) {
        if (status) status.textContent = "✅ 已安装 " + (p.name || spec) + "。重启 DSH (Harness Desktop) 后生效，然后回到此处启用。";
        toast("安装成功：" + (p.name || spec) + "，重启 DSH 后启用");
        setTimeout(refreshAll, 800);
      } else {
        if (status) status.textContent = "❌ 安装失败：" + ((r && r.error) || "未知错误");
        if (btn) btn.textContent = "重试";
        toast("安装失败");
      }
    }).catch(function () { if (btn) { btn.disabled = false; btn.textContent = "重试"; } if (status) status.textContent = "安装调用异常"; });
  }

  function doUninstall(p, btn) {
    var app = bridge();
    var status = document.querySelector("." + NS + "__status");
    if (!app || !app.UninstallMemoryPlugin) { toast("桥方法不可用"); return; }
    var spec = (p.install || "").replace(/^dsh plugin --profile web add\s*/, "") || p.id;
    if (btn) { btn.disabled = true; btn.textContent = "卸载中…"; }
    if (status) status.textContent = "正在卸载 " + (p.name || spec) + "…";
    app.UninstallMemoryPlugin(spec).then(function (r) {
      if (btn) btn.disabled = false;
      if (r && r.ok) {
        if (status) status.textContent = "✅ 已卸载 " + (p.name || spec) + "。重启 DSH 后完全移除。";
        toast("已卸载：" + (p.name || spec));
        setTimeout(refreshAll, 800);
      } else {
        if (status) status.textContent = "❌ 卸载失败：" + ((r && r.error) || "未知错误");
        toast("卸载失败");
      }
    }).catch(function () { if (btn) btn.disabled = false; });
  }

  function setEnabled(p, enabled, btn) {
    var app = bridge();
    var status = document.querySelector("." + NS + "__status");
    if (!app || !app.SetMemoryPluginEnabled) { toast("桥方法不可用"); return; }
    if (btn) btn.disabled = true;
    app.SetMemoryPluginEnabled(p.id, enabled).then(function (r) {
      if (btn) btn.disabled = false;
      if (r && r.ok) {
        if (status) status.textContent = enabled
          ? "✅ 已启用 " + (p.name || p.id) + "（默认关闭；重启 DSH (Harness Desktop) 后记忆插件加载生效）"
          : "已禁用 " + (p.name || p.id) + "（重启 DSH 后插件不再加载）";
        toast((enabled ? "已启用 " : "已禁用 ") + (p.name || p.id) + "，重启 DSH 生效");
        setTimeout(refreshAll, 500);
      } else if (status) {
        status.textContent = "设置失败：" + ((r && r.error) || "未知错误");
      }
    }).catch(function () { if (btn) btn.disabled = false; });
  }

  function refreshAll() {
    var app = bridge();
    if (!app || !app.MemoryPlugins) return;
    app.MemoryPlugins().then(function (d) {
      var boxes = document.querySelectorAll("." + NS + "__rec");
      for (var i = 0; i < boxes.length; i++) {
        var box = boxes[i];
        box.innerHTML = "";
        renderRecommended(box, d || {});
        renderInstalled(box, d || {});
      }
    }).catch(function () {});
  }

  // ===== 记忆策略（省 token）：多源警告 + 注入预算控制 =====
  var STRATEGY_INJECTORS = ["@openviking/dsh-memory-plugin", "@memtensor/memos-local-plugin", "@vectorize-io/hindsight-coding-agents"];

  function renderStrategy(host, data) {
    // 多源冲突警告：启用了 >1 个会注入记忆的插件
    var enabledOnes = (data.recommended || []).filter(function (p) {
      return STRATEGY_INJECTORS.indexOf(p.id) >= 0 && p.installed && p.enabled;
    }).map(function (p) { return p.name; });
    if (enabledOnes.length > 1) {
      var warn = document.createElement("div");
      warn.style.cssText = "border:1px solid #b45309;background:rgba(180,83,9,.12);color:#fbbf24;border-radius:8px;padding:8px 10px;font-size:11px;margin:10px 0;line-height:1.6";
      warn.innerHTML = "⚠️ 检测到 <b>" + enabledOnes.length + " 个记忆源同时启用</b>（" + esc(enabledOnes.join("、")) +
        "）——每轮都会注入多份记忆上下文，浪费 token。建议只启用一个，或用下方「按需检索」模式（零注入）。";
      host.appendChild(warn);
    }
    // 预算控制卡片
    var card = document.createElement("div");
    card.className = NS + "__card";
    card.innerHTML = '<div class="' + NS + '__name" style="margin-bottom:4px">记忆注入预算（省 token）</div>' +
      '<div class="' + NS + '__desc">每轮自动注入的记忆量上限。调低预算 = 更少 token；「按需检索」= pre-step 完全不注入（零开销），需要记忆时由 agent 显式调用检索工具。</div>';
    var app = bridge();
    var st = document.createElement("div");
    st.style.cssText = "font-size:11px;opacity:.85;margin-top:6px;min-height:14px";
    card.appendChild(st);
    if (app && app.MemoryBudgets && app.SetMemoryBudget) {
      app.MemoryBudgets().then(function (b) {
        renderBudgetUI(card, b || {}, st);
      }).catch(function () { st.textContent = "预算读取失败（桥不可用？）"; });
    } else {
      st.textContent = "桥方法不可用";
    }
    host.appendChild(card);
  }

  function slider(label, min, max, val, fmt, onChange) {
    var row = document.createElement("div");
    row.style.cssText = "display:flex;align-items:center;gap:8px;margin:5px 0;flex-wrap:wrap;font-size:11px";
    var lab = document.createElement("span");
    lab.style.cssText = "min-width:150px;opacity:.85";
    lab.textContent = label;
    var inp = document.createElement("input");
    inp.type = "range";
    inp.min = String(min); inp.max = String(max); inp.step = "1";
    inp.value = String(clampNum(val, min, max));
    inp.style.cssText = "flex:1;min-width:120px";
    var out = document.createElement("span");
    out.style.cssText = "min-width:90px;text-align:right;font-weight:600";
    out.textContent = fmt(clampNum(val, min, max));
    inp.addEventListener("input", function () { out.textContent = fmt(parseInt(inp.value, 10)); onChange(parseInt(inp.value, 10)); });
    row.appendChild(lab); row.appendChild(inp); row.appendChild(out);
    return row;
  }

  function clampNum(v, min, max) {
    var n = parseInt(v, 10);
    if (!isFinite(n)) return min;
    return Math.max(min, Math.min(max, n));
  }

  function renderBudgetUI(card, budgets, st) {
    var ov = budgets["openviking-memory"] || {};
    var mem = budgets["memos-local-memory"] || {};
    var draft = {
      ovRecall: ov.recallTokenBudget != null ? ov.recallTokenBudget : 2000,
      ovProfile: ov.profileTokenBudget != null ? ov.profileTokenBudget : 10000,
      memRecall: mem.recallEnabled !== false,
      memChars: mem.contextMaxChars != null ? mem.contextMaxChars : 6000
    };
    // memos 模式选择
    var modeRow = document.createElement("div");
    modeRow.style.cssText = "display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap;font-size:11px";
    modeRow.innerHTML = '<span style="min-width:150px;opacity:.85">memos 记忆注入</span>';
    var auto = document.createElement("label");
    auto.style.cssText = "display:flex;align-items:center;gap:4px";
    var rAuto = document.createElement("input"); rAuto.type = "radio"; rAuto.name = NS + "-mode"; rAuto.checked = draft.memRecall;
    var rOn = document.createElement("input"); rOn.type = "radio"; rOn.name = NS + "-mode"; rOn.checked = !draft.memRecall;
    auto.appendChild(rAuto); auto.appendChild(document.createTextNode("自动注入（每轮注入）"));
    var manual = document.createElement("label");
    manual.style.cssText = "display:flex;align-items:center;gap:4px";
    manual.appendChild(rOn); manual.appendChild(document.createTextNode("按需检索（零注入，推荐）"));
    modeRow.appendChild(auto); modeRow.appendChild(manual);
    card.appendChild(modeRow);
    rAuto.addEventListener("change", function () { draft.memRecall = rAuto.checked; });
    rOn.addEventListener("change", function () { draft.memRecall = !rOn.checked; });
    // 滑块
    var ovRecallRow = slider("openviking 每轮 recall 预算", 200, 5000, draft.ovRecall, function (v) { return v + " tokens"; }, function (v) { draft.ovRecall = v; });
    var ovProfileRow = slider("openviking profile 预算", 500, 50000, draft.ovProfile, function (v) { return v + " tokens"; }, function (v) { draft.ovProfile = v; });
    var memCharsRow = slider("memos 注入上下文上限", 1000, 16000, draft.memChars, function (v) { return (v / 1000).toFixed(1) + " KB"; }, function (v) { draft.memChars = v; });
    card.appendChild(ovRecallRow); card.appendChild(ovProfileRow); card.appendChild(memCharsRow);
    // 保存
    var save = document.createElement("button");
    save.className = NS + "__btn " + NS + "__btn--primary";
    save.textContent = "保存预算（重启 DSH 生效）";
    save.style.cssText = "margin-top:8px";
    save.addEventListener("click", function () {
      var app = bridge();
      save.disabled = true;
      save.textContent = "保存中…";
      Promise.all([
        app.SetMemoryBudget("openviking-memory", { recallTokenBudget: draft.ovRecall, profileTokenBudget: draft.ovProfile }),
        app.SetMemoryBudget("memos-local-memory", { recallEnabled: draft.memRecall, contextMaxChars: draft.memChars })
      ]).then(function (rs) {
        var ok = rs.every(function (r) { return r && r.ok; });
        st.textContent = ok ? "✅ 预算已保存，重启 DSH 后生效。" : "部分保存失败：" + (rs.map(function (r) { return (r && r.error) || ""; }).join("; "));
        toast(ok ? "记忆预算已保存" : "记忆预算保存失败");
        save.disabled = false; save.textContent = "保存预算（重启 DSH 生效）";
      }).catch(function () {
        st.textContent = "保存调用异常"; save.disabled = false; save.textContent = "重试";
      });
    });
    card.appendChild(save);
  }

  // 注入主区块
  function renderBlock(host, data) {
    var wrap = document.createElement("div");
    wrap.className = NS;
    wrap.innerHTML =
      '<div class="' + NS + '__head"><span class="' + NS + '__title">记忆插件（DSH 记忆能力来自插件生态）</span></div>' +
      '<div class="' + NS + '__sub">DSH 原生无记忆 API；记忆由插件提供。默认关闭——安装后请在此启用。启用后插件注册的 RPC 由桥透传，前端即可使用。</div>' +
      '<div class="' + NS + '__rec"></div>' +
      '<div class="' + NS + '__status" data-role="status"></div>' +
      '<div class="' + NS + '__hint">安装位置：~/.dsh/profiles/web（dsh plugin --profile web add）。安装/卸载/预算修改后需重启 DSH (Harness Desktop) 才生效。与「插件」页同源（dsh-1024store）：从插件市场安装的记忆插件会自动出现在上方的「已安装」列表。</div>';
    var box = wrap.querySelector("." + NS + "__rec");
    renderRecommended(box, data);
    renderInstalled(box, data);
    renderStrategy(wrap, data);
    renderMarket(box);
    host.appendChild(wrap);
  }

  // dataset 键必须用合法 identifier（连字符名会抛 SyntaxError，导致注入脚本整体崩溃）
  var hostMark = "dshMemHost";
  var injectTimer = null;
  var injectCount = 0;
  function inject() {
    // 节流：mutation 高频触发时合并为每 300ms 一次，防止设置面板渲染风暴下主线程卡死
    if (injectTimer) return;
    injectTimer = setTimeout(function () {
      injectTimer = null;
      doInject();
    }, 300);
  }
  function doInject() {
    // 全局注入标志：注入过一次后不再注入（settings-center 被 React 重建也有效）
    if (window.__DSH_MEM_PLUGINS_INJECTED) return;
    var centers = document.querySelectorAll(".settings-center");
    for (var c = 0; c < centers.length; c++) {
      var center = centers[c];
      if (center.dataset && center.dataset[hostMark] === "1") continue;
      // 等待记忆页签内容出现：MemoryPanel 渲染 .mem-section
      var mem = center.querySelector(".mem-section, .mem-facts, .mem-empty");
      if (!mem) continue;
      if (center.dataset) center.dataset[hostMark] = "1";
      window.__DSH_MEM_PLUGINS_INJECTED = true;
      var container = document.createElement("div");
      container.style.width = "100%";
      mem.parentNode.insertBefore(container, mem.nextSibling);
      var status = document.createElement("div");
      status.className = NS + "__status";
      status.textContent = "正在读取记忆插件状态…";
      container.appendChild(status);
      var app = bridge();
      if (app && app.MemoryPlugins) {
        app.MemoryPlugins().then(function (d) {
          if (!container.isConnected) return;
          status.remove();
          renderBlock(container, d || {});
        }).catch(function () {
          status.textContent = "读取失败（桥不可用？）";
        });
      } else {
        status.textContent = "桥方法不可用";
      }
    }
  }

  function start() {
    var obs = new MutationObserver(function () { inject(); });
    obs.observe(document.documentElement, { childList: true, subtree: true });
    doInject();
    // 注入成功后 3 秒断开观察（管理区已渲染，无需持续监控）
    var guard = setInterval(function () {
      if (window.__DSH_MEM_PLUGINS_INJECTED) {
        clearInterval(guard);
        obs.disconnect();
      }
    }, 500);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();

</script>




<script>

;
(function () {

  var NS = "dsh-ie";

  // A() 取 Wails Go 桥对象 window.go.main.App（前端注入上下文里唯一与 Go 通信的入口）。

  function A() {

  }

  // 全部样式内联进一个 <style>（用 NS 前缀防与前端类名冲突）：
  //  - dsh-ie-btn     预览窗口操作栏里的「✏️ 编辑 / 退出编辑」按钮
  //  - dsh-ie-ovl     编辑覆盖层（absolute 盖住预览容器，不动 React 子树）
  //  - dsh-ie-bar     覆盖层顶栏（文件名 + 快捷键提示 + 保存按钮）
  //  - dsh-ie-ta      覆盖层里的编辑区（textarea，等宽字体，2 空格缩进）
  var css = [
    "." + NS + "-btn{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:3px 9px;border-radius:6px;border:1px solid rgba(128,128,128,.35);background:rgba(28,29,33,.85);color:#e8eaed;font:600 11px Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap;line-height:1.6}",
    "." + NS + "-btn:hover{background:#3b3f46}",
    "." + NS + "-btn.save{background:#0153e5;border-color:#0153e5;color:#fff}",
    "." + NS + "-btn.save:hover{background:#1a63f0}",
    // 覆盖层：absolute 盖住预览容器(其 position 需为 relative——预览容器通常是，保险起见用 inset:0 由 JS 定位)
    "." + NS + "-ovl{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;background:#15161a;color:#dbe2ea;font:13px Inter,system-ui,sans-serif}",
    "." + NS + "-bar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(128,128,128,.18);font:11.5px Inter,system-ui,sans-serif;color:#9aa3af;flex:0 0 auto}",
    "." + NS + "-bar .nm{color:#cbd5e1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}",
    "." + NS + "-bar .sp{flex:1}",
    "." + NS + "-bar .ht{color:#6b7280}",
    "." + NS + "-ta{flex:1;width:100%;box-sizing:border-box;resize:none;border:0;outline:none;background:#15161a;color:#dbe2ea;padding:14px 16px;font:13px/1.6 Consolas,monospace;white-space:pre;overflow:auto;tab-size:2;display:block}",
    // Monaco host：同 textarea 的 flex:1 占位，Monaco 在其中自绘
    "." + NS + "-mh{flex:1;min-height:0;position:relative;background:#1e1e1e}",
  ].join("\n");
  if (!document.getElementById(NS + "-css")) {
    var s = document.createElement("style");
    s.id = NS + "-css";
    s.textContent = css;
    document.head.appendChild(s);
  }

  var overlay = null;       // 当前编辑覆盖层元素（只含自己创建的节点，退出时可整体移除）
  var editorInst = null;    // Monaco editor 实例（textarea 模式为 null）
  var relPath = "";         // 正在编辑的文件相对路径（工作区相对；保存时传给 WriteFileForTab）
  var tabId = "";           // 正在编辑的文件所属会话 tabId（进入编辑时从 Tabs 解析）

  // toast 屏幕底部轻提示（一次性，2.2s 淡出自毁）。
  function toast(m) {
    var el = document.createElement("div");
    el.style.cssText = "position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483005;background:#1c1d21;color:#f4f4f3;border:1px solid #3d4450;border-radius:8px;padding:8px 16px;font:13px Inter,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.5);opacity:0;transition:opacity .2s;pointer-events:none";
    el.textContent = m;
    document.body.appendChild(el);
    requestAnimationFrame(function () { el.style.opacity = "1"; });
    setTimeout(function () { el.style.opacity = "0"; setTimeout(function () { el.remove(); }, 220); }, 2200);
  }

  // resolveTab 异步取"当前活动会话"的 tabId（写文件需要 tabId → 工作区根）。
  // 优先 active 会话，其次列表第一个；拿不到就回调空串（保存会走绝对路径分支）。
  function resolveTab(cb) {
    var app = A();
    if (!app || !app.Tabs) return cb("");
    app.Tabs().then(function (tabs) {
      // Tabs 返回数组；兼容 {items:[...]} 包裹
      var arr = Array.isArray(tabs) ? tabs : (tabs && tabs.items) ? tabs.items : [];
      for (var i = 0; i < arr.length; i++) { if (arr[i] && arr[i].active) { cb(arr[i].tabId || ""); return; } }
      if (arr[0]) cb(arr[0].tabId || ""); else cb("");
    }).catch(function () { cb(""); });
  }

  // currentRel 从原生文件树的"活动行"取当前文件的相对路径。
  // 原生行 DOM: .workspace-tree__row--active 上带 data-workspace-path（与我们 Go 桥的 rel 同义）。
  function currentRel() {
    var active = document.querySelector(".workspace-tree__row--active[data-workspace-path]");
    return active ? (active.getAttribute("data-workspace-path") || "") : "";
  }

  // previewBody 原生预览内容容器（React 的 CodeViewer/Markdown 渲染都挂在这里）。
  // 编辑覆盖层就叠在这个容器上（它需要是定位上下文，见 enterEdit）。
  function previewBody() {
    return document.querySelector(".workspace-preview__body") || null;
  }

  // windowActions 原生预览窗口的右上操作栏（✏️ 编辑按钮就插进这里）。
  function windowActions() {
    return document.querySelector(".workspace-preview__window-actions") || null;
  }

  // ensureEditBtn 保证操作栏里存在编辑按钮（没有就补一个，已存在则跳过——防重复注入）。
  // 按钮文案按当前是否在编辑态切换（"✏️ 编辑"/"退出编辑"）。
  function ensureEditBtn() {
    var actions = windowActions();
    if (!actions || actions.querySelector("." + NS + "-btn")) return;
    var b = document.createElement("button");
    b.type = "button";
    b.className = NS + "-btn";
    b.title = "就地编辑此文件（Ctrl+S 保存，Esc 退出）";
    b.textContent = overlay ? "退出编辑" : "✏️ 编辑";
    b.onclick = function () { overlay ? exitEdit() : enterEdit(); };
    actions.appendChild(b);
  }

  // enterEdit 进入就地编辑：
  // 1) 读活动文件的 rel（没有 → 提示先选文件）；
  // 2) resolveTab 拿到 tabId，调 ReadFileForTab 读当前内容（err/binary → 提示后放弃）；
  // 3) 尝试 Monaco（加载 + 创建都成功才用）；任一失败 → textarea 轻量版回退；
  // 4) Ctrl+S 保存、Esc 退出。
  function enterEdit() {
    if (overlay) return;
    var rel = currentRel();
    if (!rel) { toast("未识别当前文件，请先在文件树选中文件"); return; }
    var app = A();
    if (!app || !app.ReadFileForTab) return;
    resolveTab(function (tid) {
      tabId = tid;
      relPath = rel;
      app.ReadFileForTab(tid, rel).then(function (pv) {
        if (pv && pv.err) { toast("读取失败: " + pv.err); return; }
        if (pv && pv.binary) { toast("二进制文件不能文本编辑"); return; }
        var body = previewBody();
        if (!body) { toast("预览区不可用"); return; }
        if (getComputedStyle(body).position === "static") body.style.position = "relative";
