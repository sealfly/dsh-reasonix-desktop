    var A = app(); var it = findItem(id); if (!A || !it) return;
    btn.textContent = '安装中…';
    var src = it.install || it.url || id;
    A.InstallPlugin(src, { name: id }).then(function(plan){
      try {
        var p = JSON.parse(plan);
        btn.textContent = (p && p.ok) ? '已安装' : '失败';
        if (p && p.ok) S.installed[id] = true;
      } catch(e){ btn.textContent = '完成'; S.installed[id] = true; }
      setTimeout(function(){ renderList(); }, 700);
    }).catch(function(){ btn.textContent = '失败'; });
  }
  function removePlugin(id, btn){
    var A = app(); if (!A) return;
    btn.textContent = '卸载中…';
    A.RemovePlugin(id).then(function(){
      delete S.installed[id];
      btn.textContent = '已卸载';
      setTimeout(function(){ renderList(); }, 700);
    }).catch(function(){ btn.textContent = '失败'; });
  }
  var obs = new MutationObserver(function(){ injectIntoPluginPage(); });
  try { obs.observe(document.documentElement, { childList: true, subtree: true }); } catch(e){}
  injectIntoPluginPage();
})();

</script>

<script>
// dsh-conn-banner.js — DSH 连接状态横幅 + 自选 DSH 后端设置
// 注入到 Reasonix v1.31.4 前端：启动后查询 A.DshConnStatus()，
// 未连接时显示横幅（启动 DSH / 连接设置），设置弹层支持 host:port 自选 + 测试。
(() => {
  const SHOWN_KEY = 'dsh-conn-banner-shown';
  const CONN_ID = 'dsh-conn-banner';
  const SETTINGS_ID = 'dsh-conn-settings';
  let statusCache = null;

  const css = `
#${CONN_ID}{position:fixed;right:14px;bottom:14px;z-index:2147483646;max-width:360px;background:linear-gradient(135deg,#0153e5,#0b3fa8);color:#fff;border-radius:10px;padding:12px 14px;font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;box-shadow:0 6px 24px rgba(1,83,229,.35);display:none}

#${SETTINGS_ID}{position:fixed;inset:0;z-index:2147483647;background:rgba(10,16,30,.55);display:none;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif}
#${SETTINGS_ID}.show{display:flex}
#${SETTINGS_ID} .s-card{background:#fff;border-radius:12px;padding:20px 22px;width:380px;max-width:92vw;box-shadow:0 12px 40px rgba(0,0,0,.35);color:#1a1a2e}
#${SETTINGS_ID} .s-title{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
#${SETTINGS_ID} .s-title .x{cursor:pointer;color:#999;font-size:18px;line-height:1;padding:2px 6px}
#${SETTINGS_ID} label{display:block;font-size:12px;color:#666;margin:10px 0 4px}
#${SETTINGS_ID} input{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #d5dae4;border-radius:7px;font-size:13px;font-family:inherit}
#${SETTINGS_ID} .s-row{display:flex;gap:10px}
#${SETTINGS_ID} .s-row .s-host{flex:1}
#${SETTINGS_ID} .s-row .s-port{width:110px}
#${SETTINGS_ID} .s-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
#${SETTINGS_ID} .s-actions button{border:none;border-radius:7px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit}
#${SETTINGS_ID} .btn-save{background:#0153e5;color:#fff;font-weight:600}
#${SETTINGS_ID} .btn-test{background:#eef2f9;color:#0153e5}
#${SETTINGS_ID} .btn-cancel{background:#f0f1f4;color:#666}
#${SETTINGS_ID} .s-status{font-size:12px;margin-top:10px;padding:8px 10px;border-radius:6px;display:none}
#${SETTINGS_ID} .s-status.ok{display:block;background:#e8f8ef;color:#147d3f}
#${SETTINGS_ID} .s-status.err{display:block;background:#fdeeee;color:#c0392b}
#${SETTINGS_ID} .s-hint{font-size:11px;color:#999;margin-top:6px}
`;

  function injectCss() {
    const s = document.createElement('style');
    s.id = CONN_ID + '-css';
    s.textContent = css;
    document.head.appendChild(s);
  }

  function el(id, html) {
    let n = document.getElementById(id);
    if (!n) {
      n = document.createElement('div');
      n.id = id;
      document.body.appendChild(n);
    }
    n.innerHTML = html;
    return n;
  }

  function showBanner() {
    el(CONN_ID, `
      <div class="b-title"><span class="dot"></span>DSH 后端未连接</div>
      <div class="b-desc">界面功能需要 DSH 后端（默认 ${statusCache ? statusCache.configured.host + ':' + statusCache.configured.port : '127.0.0.1:3080'}）。可一键启动，或自选其他 DSH 后端。</div>
      <div class="b-actions">
        <button class="btn-start" id="dsh-conn-start">🚀 启动 DSH</button>
        <button class="btn-set" id="dsh-conn-open">⚙️ 连接设置</button>
        <button class="btn-x" id="dsh-conn-close">✕</button>
      </div>
      <div class="b-status" id="dsh-conn-bstatus"></div>
    `);
    document.getElementById('dsh-conn-start').onclick = () => {
      const st = document.getElementById('dsh-conn-bstatus');
      st.style.display = 'block';
      st.textContent = '正在启动 DSH 后端...';
      window.appStartDSH && window.appStartDSH();
    };
    document.getElementById('dsh-conn-open').onclick = openSettings;
    document.getElementById('dsh-conn-close').onclick = () => {
      document.getElementById(CONN_ID).classList.remove('show');
      try { localStorage.setItem(SHOWN_KEY, Date.now().toString()); } catch (e) {}
    };
    document.getElementById(CONN_ID).classList.add('show');
  }

  function openSettings() {
    const c = (statusCache && statusCache.configured) || { host: '127.0.0.1', port: 3080 };
    el(SETTINGS_ID, `
      <div class="s-card">
        <div class="s-title">DSH 连接设置 <span class="x" id="dsh-conn-sclose">✕</span></div>
        <div class="s-row">
          <div class="s-host"><label>主机地址</label><input id="dsh-conn-host" value="${c.host}" placeholder="127.0.0.1"></div>
          <div class="s-port"><label>端口</label><input id="dsh-conn-port" value="${c.port}" placeholder="3080"></div>
        </div>
        <div class="s-hint">可指向本机或局域网/远程的 DeepSeek Harness 实例。</div>
        <div class="s-status" id="dsh-conn-sstatus"></div>
        <div class="s-actions">
          <button class="btn-test" id="dsh-conn-test">测试连接</button>
          <button class="btn-cancel" id="dsh-conn-cancel">取消</button>
          <button class="btn-save" id="dsh-conn-save">保存</button>
        </div>
      </div>
    `);
    const st = document.getElementById('dsh-conn-sstatus');
    const host = () => document.getElementById('dsh-conn-host').value.trim() || '127.0.0.1';
    const port = () => parseInt(document.getElementById('dsh-conn-port').value, 10) || 3080;
    document.getElementById('dsh-conn-sclose').onclick = closeSettings;
    document.getElementById('dsh-conn-cancel').onclick = closeSettings;
    document.getElementById('dsh-conn-test').onclick = () => {
      st.className = 's-status'; st.style.display = 'block'; st.textContent = '测试中...';
      realApp().TestDshConn(host(), port()).then(r => {
        if (r.ok) { st.className = 's-status ok'; st.textContent = '✅ 连接成功：' + r.host + ':' + r.port; }
        else { st.className = 's-status err'; st.textContent = '❌ 无法连接：' + (r.error || '未知错误'); }
      }).catch(e => { st.className = 's-status err'; st.textContent = '❌ 调用失败：' + e; });
    };
    document.getElementById('dsh-conn-save').onclick = () => {
      st.className = 's-status'; st.style.display = 'block'; st.textContent = '保存中...';
      realApp().SetDshConn(host(), port()).then(r => {
        if (r.ok && r.connected) {
          st.className = 's-status ok'; st.textContent = '✅ 已保存并连接：' + r.host + ':' + r.port;
          setTimeout(() => { closeSettings(); location.reload(); }, 900);
        } else if (r.ok) {
          st.className = 's-status err'; st.textContent = '⚠️ 已保存，但当前无法连接：' + (r.warning || '');
        } else {
          st.className = 's-status err'; st.textContent = '❌ ' + (r.error || '保存失败');
        }
      }).catch(e => { st.className = 's-status err'; st.textContent = '❌ 调用失败：' + e; });
    };
    document.getElementById(SETTINGS_ID).classList.add('show');
  }

  function closeSettings() {
    const m = document.getElementById(SETTINGS_ID);
    if (m) m.classList.remove('show');
  }

  // 通过 DSH 桥启动（走 Go 侧 DshLaunch）
  window.appStartDSH = () => {
    realApp().DshLaunch().then(r => {
      const st = document.getElementById('dsh-conn-bstatus');
      if (r.ok && r.started) {
        st.textContent = '✅ DSH 正在启动，初始化可能需要几秒...';
        setTimeout(() => location.reload(), 3500);
      } else if (r.ok && r.alreadyRunning) {
        st.textContent = '✅ DSH 已在运行，正在刷新...';
        setTimeout(() => location.reload(), 1200);
      } else {
        st.textContent = '❌ ' + (r.error || '启动失败');
      }
    }).catch(e => {
      const st = document.getElementById('dsh-conn-bstatus');
      if (st) st.textContent = '❌ 启动失败：' + e;
    });
  };

  function realApp() {
    const g = window.go && window.go.main && window.go.main.App;
    if (g) return g;
    return {
      TestDshConn: () => Promise.reject('bridge unavailable'),
      SetDshConn: () => Promise.reject('bridge unavailable'),
      DshLaunch: () => Promise.reject('bridge unavailable')
    };
  }

  function check() {
    realApp().DshConnStatus().then(s => {
      statusCache = s;
      if (!s.connected) {
        // 连接失败：显示横幅（用户关闭过则本次会话不再自动弹出，仍可在设置里操作）
        try {
          const shown = parseInt(localStorage.getItem(SHOWN_KEY) || '0', 10);
          if (shown && Date.now() - shown < 24 * 3600 * 1000) {
            // 已关闭过（24h 内）：仅保留设置入口不弹横幅
            return;
          }
        } catch (e) {}
        showBanner();
      }
    }).catch(() => {});
  }

  function boot() {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => { injectCss(); setTimeout(check, 4000); });
    } else {
      injectCss();
      setTimeout(check, 4000);
    }
  }
  boot();
})();

</script>

<script>
/* __DSH_AGENT_PRESETS v2 (DSH 四模式/Agent 预设选择器注入, 含选中箭头指示) */
// dsh-agent-presets.js — DSH 四模式（Agent 预设）选择器注入。
// 在 Composer「执行方式」菜单里追加 Agent 模式分组，点击切换 DSH 会话预设。
// v2: 自带选中视觉——高亮背景 + 右侧箭头指示当前模式（不依赖官方 CSS-in-JS 样式）。
// 独立普通脚本（非 module），不改动压缩 JSX；通过 window.go.main.App 桥调用 Go。

(function () {
  "use strict";
  var PRESETS = [
    { id: "standard", name: "标准模式", desc: "功能完整编码 Agent" },
    { id: "code", name: "PTC 模式", desc: "Code Mode SDK · TypeScript 组合" },
    { id: "minimal", name: "极简模式", desc: "bash + str_replace_editor" },
    { id: "cordis", name: "创造模式", desc: "创建自定义 preset" }
  ];
  var current = null; // 当前 preset id（本地记录）
  var injectedKey = "dsh-presets-injected";

  // 自带样式：选中项 = 高亮背景 + 右侧箭头 ▶（用户可明确看出当前模式）
  var css = [
    "." + injectedKey + "{display:flex;align-items:center;justify-content:space-between;width:100%;box-sizing:border-box;background:transparent;border:none;color:inherit;padding:7px 10px;margin:1px 0;text-align:left;cursor:pointer;font:inherit;border-radius:6px}",
    "." + injectedKey + ":hover{background:rgba(255,255,255,.08)}",
    "." + injectedKey + ".composer-access-menu__item--active,." + injectedKey + "[aria-checked='true']{background:rgba(1,83,229,.22)}",
    "." + injectedKey + ".composer-access-menu__item--active::after,." + injectedKey + "[aria-checked='true']::after{content:'\\25B6';font-size:10px;color:#5b9bff;flex:none;margin-left:8px}",
    "." + injectedKey + " .composer-access-menu__copy{display:flex;flex-direction:column;min-width:0}",
    "." + injectedKey + " .composer-access-menu__title{font-weight:600;font-size:13px;line-height:1.3}",
    "." + injectedKey + " .composer-access-menu__desc{font-size:11px;opacity:.65;margin-top:2px;line-height:1.3}"
  ].join("\n");
  var styleEl = document.createElement("style");
  styleEl.id = "dsh-presets-css";
  styleEl.textContent = css;
  document.head.appendChild(styleEl);

  function bridge() {
    try { return window.go && window.go.main && window.go.main.App ? window.go.main.App : null; }
    catch (e) { return null; }
  }

  // 菜单里插入 Agent 模式分组
  function injectInto(menu) {
    var section = menu.querySelector(".composer-access-menu__section");
    if (!section || section.querySelector("." + injectedKey)) return;
    var label = document.createElement("div");
    label.className = "composer-access-menu__label";
    label.textContent = "Agent 模式";
    section.appendChild(label);
    PRESETS.forEach(function (p) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.role = "menuitemradio";
      btn.setAttribute("aria-checked", current === p.id ? "true" : "false");
      btn.className = "composer-access-menu__item composer-intent-menu__item " + injectedKey + (current === p.id ? " composer-access-menu__item--active" : "");
      btn.title = p.desc;
      var copy = document.createElement("span");
      copy.className = "composer-access-menu__copy";
      var t = document.createElement("span");
      t.className = "composer-access-menu__title";
      t.textContent = p.name;
      var d = document.createElement("span");
      d.className = "composer-access-menu__desc";
      d.textContent = p.desc;
      copy.appendChild(t);
      copy.appendChild(d);
      btn.appendChild(copy);
      btn.addEventListener("click", function () {
        var app = bridge();
        if (!app || !app.SetAgentPresetForTab) return;
        // tabId 传空 → Go 端 activeSessionID 落到活跃会话
        app.SetAgentPresetForTab("", p.id).then(function (r) {
          if (r && r.ok) {
            current = p.id;
            syncChecks();
            if (window.__dshPresetToast) window.__dshPresetToast("已切换到 " + p.name);
          } else {
            var err = (r && r.error) || "切换失败";
            // DSH 语义：已启动(running)会话的 preset 锁定(agent-preset-locked)，
            // 不能原地切换——用该模式新开会话（session.create 带 agentPreset）。
            if (err.indexOf("locked") >= 0 || err.indexOf("started") >= 0 || err.indexOf("fixed") >= 0) {
              if (app.CreateSession) {
                if (window.__dshPresetToast) window.__dshPresetToast("当前会话已启动(预设固定)，正在用「" + p.name + "」新开会话…");
                app.CreateSession("", p.id).then(function (r2) {
                  var nid = r2 && (r2.id || r2.tabId || r2.sessionId);
                  if (nid) {
                    current = p.id;
                    syncChecks();
                    if (window.__dshPresetToast) window.__dshPresetToast("已创建「" + p.name + "」新会话 " + String(nid).substring(0, 8) + "… 请在会话列表查看");
                  } else if (window.__dshPresetToast) {
                    window.__dshPresetToast("新开会话失败：" + ((r2 && r2.error) || "未知错误"));
                  }
                }).catch(function () {
                  if (window.__dshPresetToast) window.__dshPresetToast("新开会话调用失败");
                });
              } else if (window.__dshPresetToast) {
                window.__dshPresetToast("当前会话已启动，预设固定(DSH限制)。请新开会话后再选模式");
              }
            } else if (window.__dshPresetToast) {
              window.__dshPresetToast(err);
            }
          }
        }).catch(function () {});
      });
      section.appendChild(btn);
    });
    menu.setAttribute("data-dsh-presets", "1");
  }

  // 同步所有已注入菜单的选中态（按标题匹配 preset 名，不依赖索引）
  function syncChecks() {
    var menus = document.querySelectorAll(".composer-intent-menu[data-dsh-presets='1']");
    for (var m = 0; m < menus.length; m++) {
      var items = menus[m].querySelectorAll("." + injectedKey);
      for (var i = 0; i < items.length; i++) {
        var title = items[i].querySelector(".composer-access-menu__title");
        var on = false;
        if (title) {
          for (var j = 0; j < PRESETS.length; j++) {
            if (title.textContent === PRESETS[j].name) { on = current === PRESETS[j].id; break; }
          }
        }
        items[i].setAttribute("aria-checked", on ? "true" : "false");
        items[i].classList.toggle("composer-access-menu__item--active", on);
      }
    }
  }

  // 读取当前默认 preset（首次）
  function loadCurrent() {
    var app = bridge();
    if (!app || !app.AgentPresets) return;
    app.AgentPresets().then(function (v) {
      if (!v || !v.presets) return;
      for (var i = 0; i < v.presets.length; i++) {
        if (v.presets[i].isDefault) { current = v.presets[i].id; break; }
      }
      syncChecks();
    }).catch(function () {});
  }

  // 轻量 toast（复用 body 内联样式）
  if (!window.__dshPresetToast) {
    window.__dshPresetToast = function (msg) {
      var el = document.createElement("div");
      el.style.cssText = "position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99999;background:#1c1d21;color:#f4f4f3;border:1px solid #333;border-radius:8px;padding:8px 16px;font:13px Inter,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.5);pointer-events:none;opacity:0;transition:opacity .2s";
      el.textContent = msg;
      document.body.appendChild(el);
      requestAnimationFrame(function () { el.style.opacity = "1"; });
      setTimeout(function () { el.style.opacity = "0"; setTimeout(function () { el.remove(); }, 250); }, 1800);
    };
  }

  function start() {
    loadCurrent();
    var observer = new MutationObserver(function () {
      var menus = document.querySelectorAll(".composer-intent-menu");
      for (var i = 0; i < menus.length; i++) injectInto(menus[i]);
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });
    // 立即尝试一次
    var menus = document.querySelectorAll(".composer-intent-menu");
    for (var i = 0; i < menus.length; i++) injectInto(menus[i]);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();

<script>
/* __DSH_VERSION_MANAGE v2 (DSH 核心版本管理 - 挂到 设置-更新页, 本地注入) */
// dsh-version-manage.js — 在设置面板「更新」页（updates-control 区块后）追加
// 「DSH 核心版本」管理区：当前版本 / 最新版本 / npm 版本列表选择 /
// GitHub Releases（含 win-x64 安装包直链下载）。
// 独立普通脚本（非 module）；通过 window.go.main.App 桥调用 Go。
// 样式自带（Reasonix 是 CSS-in-JS，CSS 文件无对应类）。

(function () {
  "use strict";
  if (window.__DSH_VERSION_MANAGE__) return;
  window.__DSH_VERSION_MANAGE__ = true;

  var NS = "dsh-version-manage";
  var injectTimer = null;
  var css = [
    "." + NS + "{margin:18px 0;padding:14px 16px;border:1px solid var(--border,#333);border-radius:10px;background:var(--surface,#17181b)}",
    "." + NS + "__head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}",
    "." + NS + "__title{font-weight:600;font-size:13px}",
    "." + NS + "__badge{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(1,83,229,.2);color:#7ab2ff;white-space:nowrap}",
    "." + NS + "__badge--ok{background:rgba(34,197,94,.15);color:#4ade80}",
    "." + NS + "__row{display:flex;align-items:center;gap:8px;font-size:12px;margin:5px 0;flex-wrap:wrap}",
    "." + NS + "__row b{font-weight:600}",
    "." + NS + "__row select{padding:4px 6px;border-radius:6px;border:1px solid #333;background:#222;color:inherit;font-size:12px;max-width:220px}",
    "." + NS + "__btn{padding:5px 12px;border-radius:6px;border:1px solid #333;background:rgba(255,255,255,.06);color:inherit;font-size:12px;cursor:pointer}",
    "." + NS + "__btn:hover{background:rgba(255,255,255,.12)}",
    "." + NS + "__btn--primary{border-color:#2563eb;background:rgba(1,83,229,.25);color:#7ab2ff}",
    "." + NS + "__btn:disabled{opacity:.5;cursor:not-allowed}",
    "." + NS + "__rel{border-top:1px dashed #333;margin-top:10px;padding-top:8px;font-size:11px}",
    "." + NS + "__rel-item{display:flex;align-items:center;gap:8px;margin:5px 0;flex-wrap:wrap}",
    "." + NS + "__tag{font-weight:600;color:#7ab2ff}",
    "." + NS + "__date{opacity:.6}",
    "." + NS + "__hint{opacity:.55;font-size:11px;margin-top:6px}",
    "." + NS + "__status{font-size:11px;opacity:.8;margin-top:6px;min-height:14px;word-break:break-all}",
    "." + NS + "__err{color:#f87171;font-size:11px;margin-top:4px}"
  ].join("\n");
  var styleEl = document.createElement("style");
  styleEl.id = "dsh-version-manage-css";
  styleEl.textContent = css;
  document.head.appendChild(styleEl);

  function bridge() {
    try { return window.go && window.go.main && window.go.main.App ? window.go.main.App : null; }
    catch (e) { return null; }
  }
  function toast(msg) {
    if (window.__dshPresetToast) { window.__dshPresetToast(msg); return; }
    var el = document.createElement("div");
    el.style.cssText = "position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99999;background:#1c1d21;color:#f4f4f3;border:1px solid #333;border-radius:8px;padding:8px 16px;font:13px Inter,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.5);pointer-events:none;opacity:0;transition:opacity .2s";
    el.textContent = msg;
    document.body.appendChild(el);
    requestAnimationFrame(function () { el.style.opacity = "1"; });
    setTimeout(function () { el.style.opacity = "0"; setTimeout(function () { el.remove(); }, 250); }, 2200);
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmtSize(n) {
    if (!n) return "";
    if (n > 1048576) return (n / 1048576).toFixed(1) + " MB";
    return Math.round(n / 1024) + " KB";
  }

  // 渲染「DSH 核心版本」区块
  function renderBlock(container, data) {
    var cur = data.current || "unknown";
    var latest = data.latest || cur;
    var badge = data.available ? '<span class="' + NS + '__badge">有新版本</span>'
      : '<span class="' + NS + '__badge ' + NS + '__badge--ok">已是最新</span>';

    var wrap = document.createElement("div");
    wrap.className = NS;
    wrap.innerHTML =
      '<div class="' + NS + '__head"><span class="' + NS + '__title">DSH 核心版本</span>' + badge + "</div>" +
      '<div class="' + NS + '__row"><span>当前：<b>' + esc(cur) + "</b></span>" +
      '<span>最新：<b>' + esc(latest) + "</b></span>" +
      '<button class="' + NS + '__btn" data-act="refresh">重新检测</button></div>' +
      '<div class="' + NS + '__row"><span>npm 版本选择：</span><select data-role="ver"></select>' +
      '<button class="' + NS + '__btn ' + NS + '__btn--primary" data-act="npm-dl">下载所选版本 (npm tarball)</button></div>' +
      '<div class="' + NS + '__row"><span>桌面端 Release：</span>' +
      '<a class="' + NS + '__btn" data-act="gh-open" href="#" target="_blank">打开 Releases 页</a></div>' +
      '<div class="' + NS + '__rel" data-role="rels"></div>' +
      '<div class="' + NS + '__status" data-role="status"></div>' +
      '<div class="' + NS + '__err" data-role="err"></div>' +
      '<div class="' + NS + '__hint">下载保存到 ~/.reasonix/downloads/。桌面端安装包 = DeepSeek Harness Desktop 完整安装包（内含 DSH 核心），下载后运行安装即可更新。</div>';

    var sel = wrap.querySelector('[data-role="ver"]');
    (data.versions || []).forEach(function (v) {
      var o = document.createElement("option");
      o.value = v;
      o.textContent = v;
      if (v === latest) o.textContent = v + " (latest)";
      if (v === cur) o.selected = true;
      sel.appendChild(o);
    });
    if (!sel.options.length) {
      var none = document.createElement("option");
      none.value = "";
      none.textContent = "无可用版本列表";
      sel.appendChild(none);
    }

    var relBox = wrap.querySelector('[data-role="rels"]');
    (data.releases || []).forEach(function (r) {
      var item = document.createElement("div");
      item.className = NS + "__rel-item";
      var tag = document.createElement("span");
      tag.className = "dsh-version-manage__tag";
      tag.textContent = r.tag + (r.prerelease ? " (pre)" : "");
      var date = document.createElement("span");
      date.className = NS + "__date";
      date.textContent = String(r.date || "").slice(0, 10);
      item.appendChild(tag);
      item.appendChild(date);
      if (r.winUrl) {
        var btn = document.createElement("button");
        btn.className = NS + "__btn " + NS + "__btn--primary";
        btn.textContent = "下载安装包";
        btn.dataset.url = r.winUrl;
        btn.dataset.name = (r.tag || "dsh-desktop") + "-win-x64.exe";
        btn.addEventListener("click", function () { doDownload(btn.dataset.url, btn.dataset.name, btn); });
        item.appendChild(btn);
      }
      var link = document.createElement("a");
      link.className = NS + "__btn";
      link.href = r.url || "#";
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = "详情";
      item.appendChild(link);
      relBox.appendChild(item);
    });

    wrap.querySelector('[data-act="refresh"]').addEventListener("click", function () {
      var status = wrap.querySelector('[data-role="status"]');
      status.textContent = "检测中…";
      loadData(function (d2) { renderBlock(container, d2); });
    });
    wrap.querySelector('[data-act="npm-dl"]').addEventListener("click", function () {
      var v = sel.value;
      if (!v) { toast("请先选择 npm 版本"); return; }
      doDownload("https://registry.npmjs.org/@deepseek-ai/dsh/-/dsh-" + encodeURIComponent(v) + ".tgz", "dsh-" + v + ".tgz", wrap.querySelector('[data-act="npm-dl"]'));
    });
    var gh = wrap.querySelector('[data-act="gh-open"]');
    gh.href = data.updateUrl || "https://github.com/sdkwork-ai/deepseek-harness-desktop/releases";
    gh.addEventListener("click", function () { if (!data.releases || !data.releases.length) { toast("打开 GitHub Releases 页面…"); } });

    container.appendChild(wrap);
  }

  function doDownload(url, name, btn) {
    var app = bridge();
    var status = document.querySelector('[data-role="status"]');
    if (!app || !app.DshDownloadVersion) { toast("桥方法不可用"); return; }
    if (btn) { btn.disabled = true; btn.textContent = "下载中…"; }
    if (status) status.textContent = "下载中：" + name + "（大文件请耐心等待）…";
    app.DshDownloadVersion(url, name).then(function (r) {
      if (btn) { btn.disabled = false; btn.textContent = r && r.ok ? "已下载" : "重新下载"; }
      if (status) {
        status.textContent = r && r.ok
          ? "✅ 已下载：" + (r.path || "") + "（" + fmtSize(r.size) + "）"
          : "❌ " + ((r && r.error) || "下载失败");
      }
      if (!r || !r.ok) toast("下载失败：" + ((r && r.error) || "未知错误"));
      else toast("下载完成：" + (r.fileName || name));
    }).catch(function (e) {
      if (btn) { btn.disabled = false; btn.textContent = "重试"; }
      if (status) status.textContent = "❌ 下载调用异常";
      toast("下载调用失败");
    });
  }

  function loadData(cb) {
    var app = bridge();
    if (!app || !app.DshVersionManage) { cb({ current: "unknown", latest: "", versions: [], releases: [] }); return; }
    app.DshVersionManage().then(function (d) { cb(d || {}); }).catch(function () { cb({ current: "unknown", latest: "", versions: [], releases: [] }); });
  }

  var injectedKey = "dsh-vm-injected";
  function inject() {
    // 节流：mutation 高频触发时合并为每 300ms 一次，防止设置面板渲染风暴下主线程卡死
    if (injectTimer) return;
    injectTimer = setTimeout(function () {
      injectTimer = null;
      doInject();
    }, 300);
  }
  function doInject() {
    // 锚点：设置-更新页的更新控制区块（updates-control），在其后插入 DSH 版本管理。
    // 页签切换会重建该区块，故用元素级标记（host.dataset）而非全局 once；
    // 全局注入标志防止任何重建-注入循环。
    if (window.__DSH_VM_INJECTED) return;
    var hosts = document.querySelectorAll(".updates-control");
    for (var h = 0; h < hosts.length; h++) {
      var host = hosts[h];
      if (host.dataset && host.dataset.dshVm === "1") continue;
      if (host.dataset) host.dataset.dshVm = "1";
      window.__DSH_VM_INJECTED = true;
      var container = document.createElement("div");
      container.style.cssText = "margin:14px 0 4px;width:100%";
      host.parentNode.insertBefore(container, host.nextSibling);
      var status = document.createElement("div");
      status.className = NS + "__status";
      status.style.cssText = "margin:10px 0;font-size:12px;opacity:.8";
      status.textContent = "正在读取 DSH 版本信息…";
      container.appendChild(status);
      (function (c, st) {
        loadData(function (d) {
          if (!c.isConnected) return;
          st.remove();
          renderBlock(c, d);
        });
      })(container, status);
    }
  }

  function start() {
    var obs = new MutationObserver(function () { inject(); });
    obs.observe(document.documentElement, { childList: true, subtree: true });
    doInject();
    // 注入成功后 3 秒断开观察（版本管理区已渲染，无需持续监控）
    var guard = setInterval(function () {
      if (window.__DSH_VM_INJECTED) {
        clearInterval(guard);
        obs.disconnect();
      }
    }, 500);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();

</script>

      wrap.appendChild(item);
    });
    box.appendChild(wrap);
  }

  // 记忆插件市场浏览
  function renderMarket(box) {
    var wrap = document.createElement("div");
    wrap.className = NS + "__list";
    var head = document.createElement("div");
    head.style.cssText = "font-weight:600;margin:8px 0 4px;display:flex;align-items:center;gap:8px";
    head.innerHTML = '<span>记忆插件市场（memory 分类 · dsh-1024store）</span>';
    var more = document.createElement("button");
    more.className = NS + "__btn";
    more.textContent = "刷新";
    more.addEventListener("click", function () { loadMarket(wrap, more); });
    head.appendChild(more);
    wrap.appendChild(head);
    var mkt = document.createElement("div");
    mkt.className = NS + "__mkt";
    mkt.textContent = "加载中…";
    wrap.appendChild(mkt);
    box.appendChild(wrap);
    loadMarket(wrap, more);
  }

  function loadMarket(wrap, btn) {
    var app = bridge();
    var mkt = wrap.querySelector("." + NS + "__mkt");
    if (!app || !app.MemoryPluginMarket) { mkt.textContent = "桥方法不可用"; return; }
    if (btn) btn.disabled = true;
    app.MemoryPluginMarket("", 1).then(function (d) {
      if (btn) btn.disabled = false;
      var items = (d && d.items) || [];
      if (!items.length) { mkt.textContent = "暂无记忆插件（" + ((d && d.error) || "网络异常") + "）"; return; }
      mkt.innerHTML = "";
      items.forEach(function (p) {
        var item = document.createElement("div");
        item.className = NS + "__mkt-item";
        var nm = document.createElement("span");
        nm.style.cssText = "font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap";
        nm.textContent = p.name;
        var st = document.createElement("span");
        st.className = NS + "__badge " + (p.installed ? NS + "__badge--on" : NS + "__badge--off");
        st.textContent = p.installed ? "已安装" : "★ " + fmtStars(p.stars);
        var installBtn = document.createElement("button");
        installBtn.className = NS + "__btn " + (p.installed ? "" : NS + "__btn--primary");
        installBtn.textContent = p.installed ? "已安装" : "安装";
        if (!p.installed) {
          installBtn.addEventListener("click", function () {
            doInstall({ id: p.id, name: p.name, install: p.install }, installBtn);
          });
        }
        var link = document.createElement("a");
        link.href = p.url || "#";
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = "详情";
        link.style.cssText = "color:#7ab2ff;text-decoration:none";
        item.appendChild(nm);
        item.appendChild(st);
        item.appendChild(installBtn);
        item.appendChild(link);
        mkt.appendChild(item);
      });
      mkt.appendChild((function () {
        var h = document.createElement("div");
        h.className = NS + "__hint";
        h.textContent = "共 " + (d.total || 0) + " 个记忆插件；更多可到「插件」页浏览完整市场。";
        return h;
      })());
    }).catch(function () { if (btn) btn.disabled = false; mkt.textContent = "市场加载失败"; });
  }

  function doInstall(p, btn) {
    var app = bridge();
    var status = document.querySelector("." + NS + "__status");
    if (!app || !app.InstallMemoryPlugin) { toast("桥方法不可用"); return; }
    var spec = (p.install || "").replace(/^dsh plugin --profile web add\s*/, "") || p.id;
    if (btn) { btn.disabled = true; btn.textContent = "安装中…（可能几分钟）"; }
    if (status) status.textContent = "正在安装 " + (p.name || spec) + "（npm/pnpm 下载）…";
    app.InstallMemoryPlugin(spec).then(function (r) {
      if (btn) { btn.disabled = false; }
      if (r && r.ok) {
        if (status) status.textContent = "✅ 已安装 " + (p.name || spec) + "。重启 DSH (Harness Desktop) 后生效，然后回到此处启用。";
        toast("安装成功：" + (p.name || spec) + "，重启 DSH 后启用");
        setTimeout(refreshAll, 800);
      } else {
        if (status) status.textContent = "❌ 安装失败：" + ((r && r.error) || "未知错误");
        if (btn) btn.textContent = "重试";
        toast("安装失败");
      }
    }).catch(function () { if (btn) { btn.disabled = false; btn.textContent = "重试"; } if (status) status.textContent = "安装调用异常"; });
  }

  function doUninstall(p, btn) {
    var app = bridge();
    var status = document.querySelector("." + NS + "__status");
    if (!app || !app.UninstallMemoryPlugin) { toast("桥方法不可用"); return; }
    var spec = (p.install || "").replace(/^dsh plugin --profile web add\s*/, "") || p.id;
    if (btn) { btn.disabled = true; btn.textContent = "卸载中…"; }
    if (status) status.textContent = "正在卸载 " + (p.name || spec) + "…";
    app.UninstallMemoryPlugin(spec).then(function (r) {
      if (btn) btn.disabled = false;
      if (r && r.ok) {
        if (status) status.textContent = "✅ 已卸载 " + (p.name || spec) + "。重启 DSH 后完全移除。";
        toast("已卸载：" + (p.name || spec));
        setTimeout(refreshAll, 800);
      } else {
        if (status) status.textContent = "❌ 卸载失败：" + ((r && r.error) || "未知错误");
        toast("卸载失败");
      }
    }).catch(function () { if (btn) btn.disabled = false; });
  }

  function setEnabled(p, enabled, btn) {
    var app = bridge();
    var status = document.querySelector("." + NS + "__status");
    if (!app || !app.SetMemoryPluginEnabled) { toast("桥方法不可用"); return; }
    if (btn) btn.disabled = true;
    app.SetMemoryPluginEnabled(p.id, enabled).then(function (r) {
      if (btn) btn.disabled = false;
      if (r && r.ok) {
        if (status) status.textContent = enabled
          ? "✅ 已启用 " + (p.name || p.id) + "（默认关闭；重启 DSH (Harness Desktop) 后记忆插件加载生效）"
          : "已禁用 " + (p.name || p.id) + "（重启 DSH 后插件不再加载）";
        toast((enabled ? "已启用 " : "已禁用 ") + (p.name || p.id) + "，重启 DSH 生效");
        setTimeout(refreshAll, 500);
      } else if (status) {
        status.textContent = "设置失败：" + ((r && r.error) || "未知错误");
      }
    }).catch(function () { if (btn) btn.disabled = false; });
  }

  function refreshAll() {
    var app = bridge();
    if (!app || !app.MemoryPlugins) return;
    app.MemoryPlugins().then(function (d) {
      var boxes = document.querySelectorAll("." + NS + "__rec");
      for (var i = 0; i < boxes.length; i++) {
        var box = boxes[i];
        box.innerHTML = "";
        renderRecommended(box, d || {});
        renderInstalled(box, d || {});
      }
    }).catch(function () {});
  }

  // 注入主区块
  function renderBlock(host, data) {
    var wrap = document.createElement("div");
    wrap.className = NS;
    wrap.innerHTML =
      '<div class="' + NS + '__head"><span class="' + NS + '__title">记忆插件（DSH 记忆能力来自插件生态）</span></div>' +
      '<div class="' + NS + '__sub">DSH 原生无记忆 API；记忆由插件提供。默认关闭——安装后请在此启用。启用后插件注册的 RPC 由桥透传，前端即可使用。</div>' +
      '<div class="' + NS + '__rec"></div>' +
      '<div class="' + NS + '__status" data-role="status"></div>' +
      '<div class="' + NS + '__hint">安装位置：~/.dsh/profiles/web（dsh plugin --profile web add）。安装/卸载后需重启 DSH (Harness Desktop) 才生效。与「插件」页同源（dsh-1024store）：从插件市场安装的记忆插件会自动出现在上方的「已安装」列表。</div>';
    var box = wrap.querySelector("." + NS + "__rec");
    renderRecommended(box, data);
    renderInstalled(box, data);
    renderMarket(box);
    host.appendChild(wrap);
  }

  // dataset 键必须用合法 identifier（连字符名会抛 SyntaxError，导致注入脚本整体崩溃）
  var hostMark = "dshMemHost";
  var injectTimer = null;
  var injectCount = 0;
  function inject() {
    // 节流：mutation 高频触发时合并为每 300ms 一次，防止设置面板渲染风暴下主线程卡死
    if (injectTimer) return;
    injectTimer = setTimeout(function () {
      injectTimer = null;
      doInject();
    }, 300);
  }
  function doInject() {
    // 全局注入标志：注入过一次后不再注入（settings-center 被 React 重建也有效）
    if (window.__DSH_MEM_PLUGINS_INJECTED) return;
    var centers = document.querySelectorAll(".settings-center");
    for (var c = 0; c < centers.length; c++) {
      var center = centers[c];
      if (center.dataset && center.dataset[hostMark] === "1") continue;
      // 等待记忆页签内容出现：MemoryPanel 渲染 .mem-section
      var mem = center.querySelector(".mem-section, .mem-facts, .mem-empty");
      if (!mem) continue;
      if (center.dataset) center.dataset[hostMark] = "1";
      window.__DSH_MEM_PLUGINS_INJECTED = true;
      var container = document.createElement("div");
      container.style.width = "100%";
      mem.parentNode.insertBefore(container, mem.nextSibling);
      var status = document.createElement("div");
      status.className = NS + "__status";
      status.textContent = "正在读取记忆插件状态…";
      container.appendChild(status);
      var app = bridge();
      if (app && app.MemoryPlugins) {
        app.MemoryPlugins().then(function (d) {
          if (!container.isConnected) return;
          status.remove();
          renderBlock(container, d || {});
        }).catch(function () {
          status.textContent = "读取失败（桥不可用？）";
        });
      } else {
        status.textContent = "桥方法不可用";
      }
    }
  }

  function start() {
    var obs = new MutationObserver(function () { inject(); });
    obs.observe(document.documentElement, { childList: true, subtree: true });
    doInject();
    // 注入成功后 3 秒断开观察（管理区已渲染，无需持续监控）
    var guard = setInterval(function () {
      if (window.__DSH_MEM_PLUGINS_INJECTED) {
        clearInterval(guard);
        obs.disconnect();
      }
    }, 500);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();

</script>


</body>
</html>
